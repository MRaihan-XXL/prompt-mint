<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voxel Frontier - DepthGlow preview</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:#0a0a0f;color:#f5f5f7;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}

.island{position:absolute;left:50%;top:52%;width:0;height:0;transform:rotateX(58deg) rotateZ(45deg);transform-style:preserve-3d;animation:bob 7s ease-in-out infinite alternate}
@keyframes bob{to{translate:0 -14px}}
.cube{position:absolute;transform-style:preserve-3d}
.f{position:absolute;width:34px;height:34px;border:1px solid rgba(0,0,0,.25)}
.grass{background:#4ade80}.dirt{background:#8b5a2b}.leaf{background:#22c55e}.wood{background:#78350f}
.sky{position:absolute;inset:0;background:linear-gradient(#0ea5e9 0%,#38bdf8 45%,#fbbf24 82%,#f97316 100%);opacity:.85}
.cloud{position:absolute;background:#fff;border-radius:40px;opacity:.85;filter:blur(1px)}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.55) 100%);z-index:4}

.content{position:relative;z-index:5;text-align:center;padding:0 24px;max-width:760px}
h1{font-size:clamp(2.2rem,6vw,4.2rem);line-height:1.05;letter-spacing:-.03em;font-weight:800}
p.sub{color:#a1a1b3;font-size:clamp(.95rem,2vw,1.15rem);margin-top:16px;line-height:1.6}
.tag{display:inline-block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;border:1px solid rgba(255,255,255,.22);padding:6px 14px;border-radius:999px;margin-bottom:22px;color:#cfcfe0}
</style>
</head>
<body>

<div class="sky"></div>
<div class="cloud" style="width:120px;height:34px;left:8%;top:18%;animation:drift 34s linear infinite"></div>
<div class="cloud" style="width:90px;height:26px;left:60%;top:12%;animation:drift 42s linear infinite -8s"></div>
<div class="cloud" style="width:140px;height:38px;left:30%;top:8%;animation:drift 50s linear infinite -16s;opacity:.6"></div>
<style>@keyframes drift{to{translate:110vw 0}}</style>
<div class="island" id="isle"></div>
<div class="vig"></div>

<div class="content">
<span class="tag">DepthGlow preview</span>
<h1>Voxel Frontier</h1>
<p class="sub">Live demo — the paid prompt rebuilds this scene and more in your AI.</p>
</div>
<script>
(function(){
  var isle=document.getElementById('isle');
  function cube(x,y,z,cls){var c=document.createElement('div');c.className='cube';c.style.transform='translate3d('+x+'px,'+y+'px,'+z+'px)';
    var top=document.createElement('div');top.className='f '+cls;top.style.transform='translateZ(34px)';
    var s1=document.createElement('div');s1.className='f dirt';s1.style.cssText+=';width:34px;height:34px;transform:rotateX(90deg);transform-origin:bottom';
    var s2=document.createElement('div');s2.className='f dirt';s2.style.cssText+=';width:34px;height:34px;transform:rotateY(90deg);transform-origin:left';
    c.appendChild(top);c.appendChild(s1);c.appendChild(s2);isle.appendChild(c);}
  var i=0;
  for(var gx=0;gx<5;gx++)for(var gy=0;gy<5;gy++){ if((gx===0||gx===4)&&(gy===0||gy===4)&&Math.random()>.4)continue;
    cube(gx*36,gy*36,0,(gx===2&&gy===2)?'leaf':'grass'); i++;}
  cube(2*36,2*36,-34,'wood');cube(2*36,2*36,-68,'leaf');
})();
</script>
</body>
</html>
