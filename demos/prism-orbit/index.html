<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prism Orbit — DepthGlow preview</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{margin:0;height:100%;overflow:hidden;
  background:radial-gradient(circle at 50% 42%,#1a1330,#07060d 70%)}
canvas{display:block}
.tag{position:fixed;left:18px;top:16px;color:#9b8fc4;font-size:12px;font-family:system-ui,sans-serif;letter-spacing:.08em}
</style>
</head>
<body>
<div class="tag">DEPTHGLOW · PRISM ORBIT</div>
<script src="../../js/vendor/three.min.js"></script>
<script>
(function(){
  var W=window.innerWidth,H=window.innerHeight;
  var scene=new THREE.Scene();
  var camera=new THREE.PerspectiveCamera(50,W/H,0.1,100);
  camera.position.set(0,0,9);
  var renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.setSize(W,H);document.body.appendChild(renderer.domElement);
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.1;

  scene.add(new THREE.AmbientLight(0x6b5b95,0.6));
  var rim=new THREE.DirectionalLight(0xffffff,1.1);rim.position.set(4,6,5);scene.add(rim);
  var coreLight=new THREE.PointLight(0xff5ea8,2.2,20);scene.add(coreLight);

  var core=new THREE.Mesh(
    new THREE.IcosahedronGeometry(1.15,0),
    new THREE.MeshStandardMaterial({color:0xff7ab6,emissive:0xff2e88,emissiveIntensity:0.9,flatShading:true,roughness:0.35})
  );
  scene.add(core);
  // faux-bloom halo around the core (additive shell, core-three only)
  var halo=new THREE.Mesh(new THREE.IcosahedronGeometry(1.15,0),
    new THREE.MeshBasicMaterial({color:0xff5ea8,transparent:true,opacity:0.12,
      blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.BackSide}));
  halo.scale.setScalar(1.7);scene.add(halo);

  var colors=[0xa78bfa,0x7dd3fc,0xf472b6,0xfbbf24,0x34d399,0x60a5fa,0xf87171];
  var prisms=[];
  for(var i=0;i<7;i++){
    var g=(i%2===0)?new THREE.OctahedronGeometry(0.55,0):new THREE.TetrahedronGeometry(0.62,0);
    var m=new THREE.MeshStandardMaterial({color:colors[i],flatShading:true,roughness:0.4,metalness:0.15});
    var mesh=new THREE.Mesh(g,m);
    var radius=2.6+i*0.42;
    prisms.push({mesh:mesh,radius:radius,phase:Math.random()*Math.PI*2,
      speed:0.3+Math.random()*0.35,incl:(Math.random()-0.5)*1.3,bob:Math.random()*Math.PI*2});
    scene.add(mesh);
  }

  var clock=new THREE.Clock(),t=0;
  var start=9,end=7.2,introT=0,dur=1.2,introDone=false;
  function animate(){
    requestAnimationFrame(animate);
    var dt=Math.min(clock.getDelta(),0.05);t+=dt;
    if(!introDone){
      introT+=dt;
      var k=Math.min(introT/dur,1),e=1-Math.pow(1-k,3);
      camera.position.z=start+(end-start)*e;
      if(k>=1)introDone=true;
    }
    core.rotation.y+=dt*0.4;core.rotation.x+=dt*0.2;
    prisms.forEach(function(p){
      var a=p.phase+t*p.speed;
      p.mesh.position.set(
        Math.cos(a)*p.radius,
        Math.sin(a*0.8+p.bob)*0.8*Math.cos(p.incl),
        Math.sin(a)*p.radius
      );
      p.mesh.rotation.x+=dt*0.8;p.mesh.rotation.y+=dt*0.6;
    });
    renderer.render(scene,camera);
  }
  animate();
  window.addEventListener('resize',function(){
    W=window.innerWidth;H=window.innerHeight;
    camera.aspect=W/H;camera.updateProjectionMatrix();renderer.setSize(W,H);
  });
})();
</script>
</body>
</html>
