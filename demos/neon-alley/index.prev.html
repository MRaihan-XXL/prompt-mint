  pos: new THREE.Vector3(0, 9.6, -26), pw: 0.3});

const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.12, 0.5, 1.15);
composer.addPass(bloom);
const filmPass = new ShaderPass({
  uniforms: {tDiffuse: {value: null}, uT: {value: 0}},
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }',
  fragmentShader: `uniform sampler2D tDiffuse; uniform float uT; varying vec2 vUv;
    float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    void main(){ vec4 c = texture2D(tDiffuse, vUv); vec2 q = vUv - .5; c.rgb *= 1. - dot(q, q) * 1.25; c.rgb += (h(vUv * 1000. + uT) - .5) * .018; gl_FragColor = c; }`
});
composer.addPass(filmPass);
composer.addPass(new OutputPass());

function resize() {
  const w = innerWidth, h = innerHeight, narrow = w < 720, pr = Math.min(devicePixelRatio || 1, 2);
  renderer.setPixelRatio(pr); renderer.setSize(w, h);
  composer.setPixelRatio(pr); composer.setSize(w, h);
  camera.aspect = w / h; camera.setViewOffset(w, h, w * (narrow ? 0.07 : 0.17), 0, w, h);   // vanishing point off-centre (thirds)
  rt.setSize(Math.max(2, Math.floor(w * pr * 0.5)), Math.max(2, Math.floor(h * pr * 0.5)));
  U.uRes.value.set(w * pr, h * pr);
  PU.uPx.value = h * pr / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
  rainGeo.instanceCount = narrow ? 2400 : 6500;
}
addEventListener('resize', resize);
resize();

/* ---------- input ---------- */
const ptr = {x: 0, y: 0, tx: 0, ty: 0, nx: 0, ny: 0, moved: false};
const onMove = e => { ptr.tx = e.clientX / innerWidth * 2 - 1; ptr.ty = -(e.clientY / innerHeight * 2 - 1); ptr.moved = true; };
addEventListener('pointermove', onMove, {passive: true});
addEventListener('pointerdown', onMove, {passive: true});
let lastPulse = null, lastPulseT = -9, flip = false;
function pulseNearest(T) {
  ptr.moved = false;
  const v = new THREE.Vector3(), asp = innerWidth / innerHeight;
  let best = null, bd = 0.55;
  for (const s of signs) {
    if (s.mode === 'dead') continue;
    v.copy(s.pos).project(camera);
    if (v.z > 1) continue;
    const d = Math.hypot((v.x - ptr.tx) * asp, v.y - ptr.ty);
    if (d < bd) { bd = d; best = s; }
  }
  if (best && (best !== lastPulse || T - lastPulseT > 1.1)) { best.pulse = 1; lastPulse = best; lastPulseT = T; }
}
const ray = new THREE.Raycaster(), floorPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -0.04), hit = new THREE.Vector3();
addEventListener('click', e => {
  ray.setFromCamera(new THREE.Vector2(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight * 2 - 1)), camera);
  if (!ray.ray.intersectPlane(floorPlane, hit)) return;
  for (const p of puddles) {
    const dx = (hit.x - p.cx) / p.rx, dz = (hit.z - p.cz) / p.rz;
    if (dx * dx + dz * dz > 1.15) continue;
    if (!RM) { ripple(p, hit.x, hit.z, 3.0); ripple(p, hit.x, hit.z, 1.6, 0.2); splash(hit.x, gy(hit.x) + 0.04, hit.z, 16, 2.4); }
    p.u.uFlare.value.set(hit.x, hit.z, U.uTime.value, 1);
    p.u.uFlareC.value.copy(flip ? PINK : CYAN); flip = !flip;
    break;
  }
});

/* ---------- frame loop ---------- */
function reflect() {
  mirror.scale.y = -1; wet.visible = false;
  renderer.setRenderTarget(rt); renderer.render(scene, camera); renderer.setRenderTarget(null);
  mirror.scale.y = 1; wet.visible = true;
}
let T = 0, last = performance.now(), warmup = 15;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now; T += dt;
  const I = RM ? 0.7 : 0.3 + 0.7 * smooth(-0.3, 0.8, Math.sin(T * 0.11 + 1));   // rain breathes: heavy ↔ drizzle
  const dr = RM ? 0 : 1;
  ptr.nx += (ptr.tx - ptr.nx) * (1 - Math.exp(-dt * 3)); ptr.ny += (ptr.ty - ptr.ny) * (1 - Math.exp(-dt * 3));
  camera.position.set(0.3 + ptr.nx * 0.35 + dr * 0.25 * Math.sin(T * 0.11), 1.7 + ptr.ny * 0.06, 11 + dr * 2.6 * Math.sin(T * 0.07));
  camera.rotation.set(0.035 + ptr.ny * 0.04 + dr * 0.008 * Math.sin(T * 0.17), -ptr.nx * 0.075 + dr * 0.03 * Math.sin(T * 0.09), dr * 0.006 * Math.sin(T * 0.13), 'YXZ');
  camera.updateMatrixWorld();
  if (ptr.moved) pulseNearest(T);

  for (const s of signs) updateSign(s, T, dt);
  assignLights(dt);
  lights.forEach((L, i) => { lightP[i].copy(L.position); lightC[i].set(L.color.r, L.color.g, L.color.b).multiplyScalar(L.intensity / 70 * 0.35); });

  U.uTime.value = T; U.uSwirl.value = RM ? 0.3 : 1;
  RU.uT.value = RM ? 0 : T; RU.uI.value = I;
  if (!RM) for (const p of puddles) {
    p.acc += dt * Math.min(5, (0.8 + 3.2 * I) * p.rx * p.rz / 1.5);
    while (p.acc > 1) {
      p.acc -= 1;
      const a = Math.random() * 6.283, d = Math.sqrt(Math.random()) * 0.7, x = p.cx + Math.cos(a) * d * p.rx, z = p.cz + Math.sin(a) * d * p.rz;
      ripple(p, x, z, 0.45 + Math.random() * 0.6);
      if (I > 0.45) splash(x, gy(x) + 0.04, z, 2 + Math.floor(Math.random() * 3));
    }
  }
  updateSteam(T);
  updateSplash(dt);
  filmPass.uniforms.uT.value = (T * 60 | 0) % 997;
  if (warmup > 0) {
    // warmup: composer render TANPA reflect flip — texture upload dalam flipped context (reflect)
    // corrupt texture di SwiftShader/headless; upload dulu di context normal, baru reflect
    warmup--;
    composer.render();
    return;
  }
  reflect();
  composer.render();
}
requestAnimationFrame(frame);
window.__dbg = { renderer, scene, camera, composer };
</script>
