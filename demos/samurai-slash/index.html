<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Samurai Slash - DepthGlow preview</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:#0a0a0f;color:#f5f5f7;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}

.lines{position:absolute;inset:-30%;background:conic-gradient(from 0deg,transparent 0 4deg,rgba(15,23,42,.9) 4deg 5.5deg,transparent 5.5deg 10deg);opacity:.55}
.slash{position:absolute;left:-10%;top:50%;width:120%;height:6px;background:#fff;box-shadow:0 0 24px 4px #f43f5e,0 0 60px 12px rgba(244,63,94,.4);rotate:-35deg;transform-origin:center}
.star{position:absolute;left:56%;top:38%;width:70px;height:70px;background:#fff;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{scale:1.06}}
.petal{position:absolute;width:12px;height:8px;background:#f9a8d4;border-radius:60% 40% 60% 40%;animation:petal 8s linear infinite}
@keyframes petal{to{translate:60vw 110vh;rotate:720deg;opacity:.2}}
.bar{position:absolute;left:0;right:0;height:8vh;background:#000;z-index:8}

.content{position:relative;z-index:5;text-align:center;padding:0 24px;max-width:760px}
h1{font-size:clamp(2.2rem,6vw,4.2rem);line-height:1.05;letter-spacing:-.03em;font-weight:800}
p.sub{color:#a1a1b3;font-size:clamp(.95rem,2vw,1.15rem);margin-top:16px;line-height:1.6}
.tag{display:inline-block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;border:1px solid rgba(255,255,255,.22);padding:6px 14px;border-radius:999px;margin-bottom:22px;color:#cfcfe0}
</style>
</head>
<body>

<div class="lines"></div>
<div class="slash"></div>
<div class="star"></div>
<svg style="position:absolute;left:6%;bottom:8vh;z-index:3" width="200" height="300" viewBox="0 0 200 300">
<path d="M100 40 Q118 40 120 58 Q120 70 112 76 L118 96 Q150 110 152 160 L158 296 L42 296 L48 160 Q50 110 82 96 L88 76 Q80 70 80 58 Q82 40 100 40Z" fill="#09090b"/>
<circle cx="100" cy="34" r="14" fill="#09090b"/>
<rect x="92" y="16" width="16" height="14" rx="4" fill="#09090b"/>
<!-- katana -->
<g transform="rotate(-35 150 140)"><rect x="146" y="20" width="8" height="220" fill="#cbd5e1" stroke="#0f172a" stroke-width="2"/><rect x="138" y="238" width="24" height="8" fill="#334155"/><rect x="144" y="246" width="12" height="40" fill="#7c2d12"/></g>
</svg>
<div class="bar" style="top:0"></div>
<div class="bar" style="bottom:0"></div>

<div class="content">
<span class="tag">DepthGlow preview</span>
<h1>Samurai Slash</h1>
<p class="sub">Live demo — the paid prompt rebuilds this scene and more in your AI.</p>
</div>
<script>
(function(){
  for(var i=0;i<12;i++){var p=document.createElement('div');p.className='petal';
    p.style.left=(Math.random()*100)+'%';p.style.top=(Math.random()*-30)+'%';
    p.style.animationDuration=(7+Math.random()*4)+'s';
    p.style.animationDelay=(Math.random()*8)+'s';document.body.appendChild(p);}
})();
</script>
</body>
</html>
