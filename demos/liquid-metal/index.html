<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Liquid Metal — DepthGlow preview</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{margin:0;height:100%;overflow:hidden;background:#05060c}
canvas{display:block}
.tag{position:fixed;left:18px;top:16px;color:#8fb8e6;font-size:12px;font-family:system-ui,sans-serif;letter-spacing:.08em;z-index:2}
</style>
</head>
<body>
<div class="tag">DEPTHGLOW · LIQUID METAL</div>
<script type="importmap">
{"imports":{"three":"../../js/vendor/three.module.min.js","three/addons/":"../../js/vendor/jsm/"}}
</script>
<script type="module">
import * as THREE from "three";
(function(){
  var W=window.innerWidth,H=window.innerHeight;
  var scene=new THREE.Scene();
  var camera=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
  var renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.setSize(W,H);document.body.appendChild(renderer.domElement);

  var uniforms={
    uTime:{value:0},
    uMouse:{value:new THREE.Vector2(0.5,0.5)},
    uRes:{value:new THREE.Vector2(W,H)},
    uMode:{value:0} // 0 = oil-slick rainbow, 1 = liquid mercury
  };

  var frag=[
    "precision highp float;",
    "uniform float uTime;uniform vec2 uMouse;uniform vec2 uRes;uniform float uMode;",
    "varying vec2 vUv;",
    // 2D hash + value noise
    "float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}",
    "float noise(vec2 p){vec2 i=floor(p);vec2 f=fract(p);vec2 u=f*f*(3.0-2.0*f);",
    " return mix(mix(hash(i),hash(i+vec2(1,0)),u.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),u.x),u.y);}",
    "float smin(float a,float b,float k){float h=clamp(0.5+0.5*(b-a)/k,0.0,1.0);return mix(b,a,h)-k*h*(1.0-h);}",
    // metaball field
    "float field(vec2 uv,float t){",
    " float m=1e9;",
    " for(int i=0;i<5;i++){",
    "   float fi=float(i);",
    "   vec2 c=vec2(0.52*sin(t*0.7+fi*1.9),0.42*cos(t*0.6+fi*2.3));",
    "   c=mix(c,uMouse*2.0-1.0,0.25*sin(fi+t*0.3));",
    "   float d=length(uv-c);",
    "   m=smin(m,d,0.22);",
    " }",
    " return m;",
    "}",
    "vec3 hue(float h){return 0.55+0.45*cos(6.28318*(h+vec3(0.0,0.33,0.67)));}",
    "void main(){",
    " vec2 uv=(gl_FragCoord.xy-0.5*uRes)/uRes.y;",
    " float t=uTime;",
    " float e=0.0015;",
    " float f0=field(uv,t);",
    " float fx=field(uv+vec2(e,0.0),t);",
    " float fy=field(uv+vec2(0.0,e),t);",
    " vec3 n=normalize(vec3((f0-fx)/e,(f0-fy)/e,1.6));",
    " vec3 v=normalize(vec3(uv,1.2));",
    " float fres=pow(1.0-max(dot(n,v),0.0),2.5);",
    // thin-film / oil-slick rainbow driven by angle + time + field
    " float h=fres*1.4 + f0*1.8 + t*0.05 + dot(n,vec3(0.3,0.5,0.7));",
    " vec3 chrome=mix(vec3(0.05,0.08,0.15),hue(h),0.30*(1.0-uMode)+0.03);",
    " chrome=mix(chrome,vec3(dot(chrome,vec3(0.33)))*vec3(0.85,0.92,1.05),uMode*0.85);",
    " chrome+=fres*vec3(0.7,0.85,1.0)*(1.1+uMode*0.5);",
    " vec3 L=normalize(vec3(-0.45,0.7,0.55));",
    " float spec=pow(max(dot(n,L),0.0),30.0);",
    " chrome+=vec3(0.92,0.96,1.0)*spec*0.85;",
    " chrome+=vec3(0.10,0.13,0.22)*(1.0-smoothstep(0.0,0.10,f0));", // inner glow
    " chrome*=1.0-smoothstep(0.18,0.24,f0);", // crisp blob mask (inside is low distance)
    " chrome*=1.55;",
    " chrome*=1.0-0.35*length(uv)*0.5;", // vignette
    " chrome+=vec3(0.02,0.03,0.06);",
    " gl_FragColor=vec4(chrome,1.0);",
    "}"
  ].join("\n");

  var vert=[
    "varying vec2 vUv;",
    "void main(){vUv=uv;gl_Position=vec4(position,1.0);}"
  ].join("\n");

  var quad=new THREE.Mesh(
    new THREE.PlaneGeometry(2,2),
    new THREE.ShaderMaterial({uniforms:uniforms,vertexShader:vert,fragmentShader:frag})
  );
  scene.add(quad);

  window.addEventListener('pointermove',function(e){
    uniforms.uMouse.value.set(e.clientX/W,1.0-e.clientY/H);
  });
  // click = toggle mercury <-> oil-slick
  var modeTarget=0;
  document.addEventListener('click',function(){modeTarget=1-modeTarget;});
  var RM=matchMedia("(prefers-reduced-motion: reduce)").matches;

  var clock=new THREE.Clock();
  function animate(){
    requestAnimationFrame(animate);
    uniforms.uTime.value+=Math.min(clock.getDelta(),0.05);
    uniforms.uMode.value+=(modeTarget-uniforms.uMode.value)*0.04;
    renderer.render(scene,camera);
  }
  if(RM){renderer.render(scene,camera);}else{animate();}
  window.addEventListener('resize',function(){
    W=window.innerWidth;H=window.innerHeight;
    renderer.setSize(W,H);uniforms.uRes.value.set(W,H);
  });
})();
</script>
</body>
</html>
