<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mecha Hangar - DepthGlow preview</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:#0a0a0f;color:#f5f5f7;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}

.floor{position:absolute;inset:40% -20% -20%;background:repeating-linear-gradient(90deg,#164e63 0 2px,transparent 2px 60px),repeating-linear-gradient(0deg,#164e63 0 2px,transparent 2px 60px);transform:perspective(500px) rotateX(72deg);opacity:.5}
.rim{position:absolute;top:12%;bottom:24%;width:10px;background:#22d3ee;box-shadow:0 0 30px 6px rgba(34,211,238,.5)}
.hazard{position:absolute;left:0;right:0;bottom:6vh;height:26px;background:repeating-linear-gradient(45deg,#eab308 0 18px,#0a0a0f 18px 36px);opacity:.85}
.mecha{position:absolute;left:50%;top:46%;translate:-50% -50%;z-index:3;animation:breathe 5s ease-in-out infinite alternate}
@keyframes breathe{to{translate:-50% calc(-50% - 6px)}}
.panel{position:absolute;border:3px solid #0f172a}
.shadow-tone{position:absolute;background:rgba(15,23,42,.55)}
.visor{position:absolute;height:12px;background:#22d3ee;box-shadow:0 0 18px #22d3ee;border:2px solid #0f172a;animation:flick 7s step-end infinite}
@keyframes flick{0%,96%,100%{opacity:1}97%{opacity:.3}}
.steam{position:absolute;width:280px;height:280px;border-radius:50%;background:rgba(255,255,255,.12);filter:blur(40px);animation:drift 20s ease-in-out infinite alternate}
@keyframes drift{to{translate:120px -30px}}
.hud{position:absolute;left:50%;top:44%;translate:-50% -50%;width:420px;height:420px;border-radius:50%;background:conic-gradient(rgba(34,211,238,.35) 0 12deg,transparent 12deg 40deg);mask:radial-gradient(circle,transparent 58%,#000 60%,#000 63%,transparent 65%);animation:spin 20s linear infinite;z-index:2}
@keyframes spin{to{rotate:360deg}}
.pillar{position:absolute;top:0;bottom:0;width:9vw;background:#111827;border-inline:3px solid #0f172a;z-index:6}

.content{position:relative;z-index:5;text-align:center;padding:0 24px;max-width:760px}
h1{font-size:clamp(2.2rem,6vw,4.2rem);line-height:1.05;letter-spacing:-.03em;font-weight:800}
p.sub{color:#a1a1b3;font-size:clamp(.95rem,2vw,1.15rem);margin-top:16px;line-height:1.6}
.tag{display:inline-block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;border:1px solid rgba(255,255,255,.22);padding:6px 14px;border-radius:999px;margin-bottom:22px;color:#cfcfe0}
</style>
</head>
<body>

<div class="floor"></div>
<div class="rim" style="left:24%"></div>
<div class="rim" style="right:24%"></div>
<div class="hud"></div>
<div class="steam" style="left:10%;bottom:10%"></div>
<div class="steam" style="right:12%;bottom:16%;animation-delay:-9s"></div>
<div class="mecha" id="mecha"></div>
<div class="hazard"></div>
<div class="pillar" style="left:0"></div>
<div class="pillar" style="right:0"></div>

<div class="content">
<span class="tag">DepthGlow preview</span>
<h1>Mecha Hangar</h1>
<p class="sub">Live demo — the paid prompt rebuilds this scene and more in your AI.</p>
</div>
<script>
(function(){
  var m=document.getElementById('mecha');
  function p(cls,css){var d=document.createElement('div');d.className='panel '+cls;d.style.cssText=css;m.appendChild(d);return d;}
  // legs
  p('','left:38%;top:56%;width:44px;height:150px;background:#334155');p('shadow-tone','left:60%;top:56%;width:22px;height:150px');
  p('','left:56%;top:56%;width:44px;height:150px;background:#475569');
  // hips
  p('','left:36%;top:48%;width:120px;height:34px;background:#1e3a5f');
  // torso
  p('','left:34%;top:26%;width:150px;height:120px;background:#1d4ed8');p('shadow-tone','left:104px;top:26px;width:80px;height:120px;left:calc(34% + 74px)');
  // shoulders
  p('','left:18%;top:22%;width:60px;height:60px;background:#0ea5e9;rotate:-14deg');
  p('','left:calc(100% - 78px);top:22%;width:60px;height:60px;background:#0284c7;rotate:14deg');
  // head
  p('','left:44%;top:12%;width:56px;height:44px;background:#334155');
  // V-fin
  var vf=document.createElement('div');vf.style.cssText='position:absolute;left:41%;top:4%;width:70px;height:16px;background:linear-gradient(90deg,#eab308,#facc15,#eab308);clip-path:polygon(0 100%,18% 0,50% 60%,82% 0,100% 100%);z-index:4;border:2px solid #0f172a';m.appendChild(vf);
  // visor
  var v=document.createElement('div');v.className='visor';v.style.cssText+=';left:45.5%;top:20%;width:40px';m.appendChild(v);
  // chest vents
  p('','left:42%;top:34%;width:16px;height:26px;background:#f43f5e;opacity:.9');
  p('','left:47%;top:34%;width:16px;height:26px;background:#f43f5e;opacity:.7');
  m.style.width='100%';m.style.height='100%';m.style.position='absolute';
})();
</script>
</body>
</html>
