<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lofi Study Room - DepthGlow preview</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:#0a0a0f;color:#f5f5f7;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}

.room{position:absolute;inset:0;background:linear-gradient(160deg,#2d2a3e,#1e1b2e 60%)}
.win{position:absolute;right:8%;top:10%;width:34%;height:60%;background:linear-gradient(#3b3654,#252238);border-radius:18px;border:6px solid #443f5e;overflow:hidden}
.rain{position:absolute;width:2px;height:16px;background:linear-gradient(transparent,#93c5fd);border-radius:2px;animation:fall 1.1s linear infinite}
@keyframes fall{to{translate:0 420px;opacity:0}}
.lamp{position:absolute;left:14%;top:38%;width:90px;height:90px;background:radial-gradient(circle,#fdba74 0%,transparent 70%);border-radius:50%;animation:flick 4s ease-in-out infinite}
@keyframes flick{50%{opacity:.85}}
.steam{position:absolute;width:8px;height:26px;background:rgba(255,255,255,.35);border-radius:8px;filter:blur(4px);animation:rise 3.6s ease-in-out infinite}
@keyframes rise{to{translate:0 -46px;opacity:0}}
.scan{position:absolute;inset:0;z-index:6;pointer-events:none;opacity:.05;background:repeating-linear-gradient(0deg,#000 0 1px,transparent 1px 3px)}

.content{position:relative;z-index:5;text-align:center;padding:0 24px;max-width:760px}
h1{font-size:clamp(2.2rem,6vw,4.2rem);line-height:1.05;letter-spacing:-.03em;font-weight:800}
p.sub{color:#a1a1b3;font-size:clamp(.95rem,2vw,1.15rem);margin-top:16px;line-height:1.6}
.tag{display:inline-block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;border:1px solid rgba(255,255,255,.22);padding:6px 14px;border-radius:999px;margin-bottom:22px;color:#cfcfe0}
</style>
</head>
<body>

<div class="room"></div>
<div class="win" id="win"></div>
<div class="lamp" style="left:16%;top:44%"></div>
<div class="steam" style="left:30%;top:58%"></div>
<div class="steam" style="left:32.5%;top:60%;animation-delay:1.2s"></div>
<div class="steam" style="left:35%;top:58%;animation-delay:2.4s"></div>
<svg style="position:absolute;left:18%;top:30%;z-index:3" width="220" height="320" viewBox="0 0 220 320">
<path d="M60 320 C60 220 40 200 55 150 C55 110 85 90 110 90 C135 90 165 110 165 150 C180 200 160 220 160 320 Z" fill="#14121f"/>
<circle cx="110" cy="78" r="42" fill="#14121f"/>
<path d="M68 70 C60 40 90 22 110 24 C130 22 160 40 152 70 C150 52 130 44 110 44 C90 44 70 52 68 70Z" fill="#1e1b2e"/>
</svg>
<div class="scan"></div>

<div class="content">
<span class="tag">DepthGlow preview</span>
<h1>Lofi Study Room</h1>
<p class="sub">Live demo — the paid prompt rebuilds this scene and more in your AI.</p>
</div>
<script>
(function(){
  var win=document.getElementById('win');
  for(var i=0;i<14;i++){var r=document.createElement('div');r.className='rain';
    r.style.left=(6+Math.random()*88)+'%';r.style.top=(Math.random()*-40)+'px';
    r.style.animationDelay=(Math.random()*1.1)+'s';win.appendChild(r);}
})();
</script>
</body>
</html>
