<style>
@font-face{font-family:'Fraunces';src:url(../../fonts/Fraunces-var.woff2) format('woff2');font-weight:400 700;font-style:normal;font-display:swap}

:root{--glass:rgba(255,255,255,.13);--glass-hi:rgba(255,255,255,.3);--line:rgba(255,255,255,.3);--ink:#f6fbff;--shadow:0 10px 34px rgba(3,24,48,.38)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.btn{appearance:none;border:1px solid var(--line);background:var(--glass);color:var(--ink);font:700 13px/1 'Nunito Sans',system-ui,sans-serif;letter-spacing:.02em;padding:10px 12px 10px 15px;border-radius:999px;display:inline-flex;align-items:center;gap:10px;cursor:pointer;-webkit-backdrop-filter:blur(16px) saturate(1.5);backdrop-filter:blur(16px) saturate(1.5);box-shadow:var(--shadow);transition:background .2s,transform .2s,border-color .2s}

<script type="module">
import * as THREE from 'three';

/* ============================================================
   Ocean Shallows — zero-CDN, procedural, WebGL2 (three r170 ESM)
   World: 48 x 32 units, x right, z down-screen, y up. Sea level y = 0.
   ============================================================ */
const WW = 48, WH = 32;                       // world size
const MAXC = 48;                              // creature cap
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const rnd = (a = 1, b) => (b === undefined ? Math.random() * a : a + Math.random() * (b - a));
const wrapPi = a => { a %= TAU; if (a > Math.PI) a -= TAU; if (a < -Math.PI) a += TAU; return a; };
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const canvas = document.getElementById('gl');
const reducedMQ = matchMedia('(prefers-reduced-motion: reduce)');
let reduced = reducedMQ.matches;
reducedMQ.addEventListener('change', e => { reduced = e.matches; });

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance', preserveDrawingBuffer: true });
  if (!renderer.capabilities.isWebGL2 || !(renderer.extensions.has('EXT_color_buffer_float') || renderer.extensions.has('EXT_color_buffer_half_float'))) throw new Error('webgl2-float-unavailable');
} catch (err) {
  document.getElementById('fallback').classList.add('on');
  throw err;
}
renderer.setClearColor(0x0a3b5c, 1);
renderer.autoClear = true;

/* ---------- shared uniforms (one object, referenced by every material) ---------- */
const U = {
  uTime: { value: 0 }, uCalm: { value: 0 }, uRain: { value: 0 },
  uBeach: { value: new THREE.Vector3(-24, -16, 8) },
  uSun: { value: new THREE.Vector3(-0.45, 0.78, -0.33).normalize() },
  uWorld: { value: new THREE.Vector2(WW, WH) },
  uSunShift: { value: new THREE.Vector2(0.58, 0.42) },
  uWhirl: { value: new THREE.Vector3(0, 0, 0) },
  uCam: { value: new THREE.Vector3(0, 40, 0) }
};
const B = U.uBeach.value;

/* ---------- JS mirrors of the GLSL shore / depth model ---------- */
const swashOff = a => 0.25 * Math.sin(a * 2 + 0.6) + 0.07 * Math.sin(a * 7 + 1.7);
function shoreS(x, z) {
  const dx = x - B.x, dz = z - B.y, a = Math.atan2(dz, dx);
  return Math.hypot(dx, dz) - B.z * (1 + 0.07 * Math.sin(a * 6 + 0.8) + 0.045 * Math.sin(a * 13 + 2.1));
}
const bedDepth = (x, z) => 0.035 + 3.1 * (1 - Math.exp(-Math.max(shoreS(x, z), 0) * 0.1));

/* ---------- GLSL building blocks ---------- */
const GL_BASE = /* glsl */`
uniform float uTime; uniform float uCalm; uniform float uRain;
uniform vec3 uBeach; uniform vec3 uSun; uniform vec2 uWorld; uniform vec2 uSunShift;
const float PI=3.14159265; const float TAU=6.2831853;
float hash21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
vec2 hash22(vec2 p){float n=hash21(p);return vec2(n,hash21(p+n+19.19));}
float vnoise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);
  return mix(mix(hash21(i),hash21(i+vec2(1.0,0.0)),f.x),mix(hash21(i+vec2(0.0,1.0)),hash21(i+vec2(1.0,1.0)),f.x),f.y);}
float fbm(vec2 p){float a=0.5,s=0.0;for(int i=0;i<4;i++){s+=a*vnoise(p);p=p*2.03+17.1;a*=0.5;}return s;}
float shoreS(vec2 p){vec2 d=p-uBeach.xy;float a=atan(d.y,d.x);
  float w=1.0+0.07*sin(a*6.0+0.8)+0.045*sin(a*13.0+2.1);return length(d)-uBeach.z*w;}
float waterDepth(vec2 p){float s=max(shoreS(p),0.0);return 0.035+3.1*(1.0-exp(-s*0.1));}
float aOff(float a){return 0.25*sin(a*2.0+0.6)+0.07*sin(a*7.0+1.7);}
`;
const GL_FX = /* glsl */`
float causticLayer(vec2 p,float t){
  vec2 i=p;float c=1.0;float inten=0.005;
  for(int n=0;n<4;n++){
    float tt=t*(1.0-(3.5/float(n+1)));
    i=p+vec2(cos(tt-i.x)+sin(tt+i.y),sin(tt-i.y)+cos(tt+i.x));
    c+=1.0/length(vec2(p.x/(sin(i.x+tt)/inten),p.y/(cos(i.y+tt)/inten)));
  }
  c/=4.0;c=1.17-pow(c,1.4);
  return pow(abs(c),8.0);
}
float caustic(vec2 w){
  float t=uTime*0.5+23.0;
  vec2 p1=mod(w*1.15,TAU)-250.0;
  vec2 p2=mod(mat2(0.8,-0.6,0.6,0.8)*w*0.83+5.0,TAU)-250.0;
  return 0.5*(causticLayer(p1,t)+causticLayer(p2,t*0.8+4.0));
}
vec3 underwater(vec3 c,vec3 wp){
  float dep=-wp.y; if(dep<=0.0) return c;
  float bed=waterDepth(wp.xz);
  float k=1.0-exp(-dep*0.6);
  vec3 sc=mix(vec3(0.16,0.72,0.74),vec3(0.015,0.12,0.40),1.0-exp(-bed*0.9));
  float cs=caustic(wp.xz)*exp(-dep*0.6);
  c*=1.0+0.45*cs;
  return mix(c,sc,k*0.78);
}
`;
const GL_ROT = /* glsl */`
mat3 rotY(float a){float c=cos(a),s=sin(a);return mat3(c,0.0,-s, 0.0,1.0,0.0, s,0.0,c);}
mat3 rotX(float a){float c=cos(a),s=sin(a);return mat3(1.0,0.0,0.0, 0.0,c,s, 0.0,-s,c);}
mat3 rotZ(float a){float c=cos(a),s=sin(a);return mat3(c,s,0.0, -s,c,0.0, 0.0,0.0,1.0);}
`;

/* ---------- layout: the view is anchored to the world's top-left corner ---------- */
const view = { x0: -WW / 2, z0: -WH / 2, x1: WW / 2, z1: WH / 2, Wv: WW, Hv: WH };
const camera = new THREE.PerspectiveCamera(34, 1, 1, 200);
camera.up.set(0, 0, -1);
const FOVT = Math.tan(THREE.MathUtils.degToRad(34) / 2);
let beachBaked = -1;
function layout() {
  const w = innerWidth, h = innerHeight, asp = w / h;
  view.Hv = Math.min(WH, WW / asp); view.Wv = view.Hv * asp;
  view.x0 = -WW / 2; view.z0 = -WH / 2; view.x1 = view.x0 + view.Wv; view.z1 = view.z0 + view.Hv;
  const R = 0.32 * Math.min(view.Wv, view.Hv);
  B.set(view.x0 - 0.1 * R, view.z0 - 0.1 * R, R);
  camera.aspect = asp;
  const hgt = (view.Hv / 2) / FOVT;
  camera.position.set(view.x0 + view.Wv / 2, hgt, view.z0 + view.Hv / 2);
  camera.lookAt(camera.position.x, 0, camera.position.z);
  camera.updateProjectionMatrix(); camera.updateMatrixWorld();
  U.uCam.value.copy(camera.position);
  renderer.setSize(w, h, false);
}

/* ============================================================
   SEABED — baked once to a canvas texture (sand ripples, seagrass,
   coral, boulders, rubble, starfish, shells, urchins + contact shadows)
   ============================================================ */
const BED_W = 1920, BED_H = 1280, PPU = BED_W / WW;
const bedCanvas = document.createElement('canvas');
bedCanvas.width = BED_W; bedCanvas.height = BED_H;
const bctx = bedCanvas.getContext('2d', { willReadFrequently: false });
const bedTex = new THREE.CanvasTexture(bedCanvas);
bedTex.flipY = false;
bedTex.generateMipmaps = true;
bedTex.minFilter = THREE.LinearMipmapLinearFilter;
bedTex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());

const hsh = (x, y) => { let h = Math.imul(x, 374761393) + Math.imul(y, 668265263) | 0; h = Math.imul(h ^ h >>> 13, 1274126177); return ((h ^ h >>> 16) >>> 0) / 4294967296; };
function vn(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
  const a = hsh(ix, iy), b = hsh(ix + 1, iy), c = hsh(ix, iy + 1), d = hsh(ix + 1, iy + 1);
  return a + (b - a) * sx + (c - a) * sy + (a - b - c + d) * sx * sy;
}

function paintSand() {
  const img = bctx.createImageData(BED_W, BED_H), d = img.data;
  const cx = -24.7, cz = -16.7;               // ripples run parallel to the shore
  let i = 0;
  for (let py = 0; py < BED_H; py++) {
    const z = py / PPU - WH / 2;
    for (let px = 0; px < BED_W; px++, i += 4) {
      const x = px / PPU - WW / 2;
      const r = Math.hypot(x - cx, z - cz);
      const warp = 2.2 * vn(x * 0.22, z * 0.22) + 0.55 * vn(x * 0.9 + 7, z * 0.9 + 3);
      const rip = Math.pow(0.5 + 0.5 * Math.sin(r * (TAU / 0.62) + warp * 5.0), 1.5);
      const patch = vn(x * 0.12 + 40, z * 0.12 + 9) - 0.5;
      const g = (hsh(px, py) - 0.5) * 0.07 + (vn(x * 7, z * 7) - 0.5) * 0.05;
      const m = 0.83 + 0.2 * rip + g;
      d[i] = clamp((224 + patch * 30) * m, 0, 255);
      d[i + 1] = clamp((204 + patch * 20) * m, 0, 255);
      d[i + 2] = clamp((160 - patch * 18) * m, 0, 255);
      d[i + 3] = 255;
    }
  }
  bctx.setTransform(1, 0, 0, 1, 0, 0);
  bctx.putImageData(img, 0, 0);
}

function bakeSeabed() {
  beachBaked = B.z;
  paintSand();
  const c = bctx;
  c.setTransform(PPU, 0, 0, PPU, BED_W / 2, BED_H / 2);   // draw in world units
  c.lineCap = 'round'; c.lineJoin = 'round';
  const rand = mulberry32(90210);
  const R = (a, b) => a + (b - a) * rand();
  const wet = (x, z, m) => shoreS(x, z) > m && Math.abs(x) < WW / 2 - 0.6 && Math.abs(z) < WH / 2 - 0.6;
  const pick = (lo, hi) => { for (let k = 0; k < 60; k++) { const x = R(-WW / 2, WW / 2), z = R(-WH / 2, WH / 2), s = shoreS(x, z); if (s > lo && s < hi && wet(x, z, lo)) return [x, z]; } return null; };
  const soft = (x, z, rx, rz, a, col = '18,14,8') => {
    c.save(); c.translate(x, z); c.scale(rx, rz);
    const g = c.createRadialGradient(0, 0, 0, 0, 0, 1);
    g.addColorStop(0, `rgba(${col},${a})`); g.addColorStop(0.55, `rgba(${col},${a * 0.5})`); g.addColorStop(1, `rgba(${col},0)`);
    c.fillStyle = g; c.beginPath(); c.arc(0, 0, 1, 0, TAU); c.fill(); c.restore();
  };
  const shadow = (x, z, r, h = 1) => { soft(x + r * 0.5 * h, z + r * 0.38 * h, r * 1.35, r * 1.15, 0.5); soft(x, z, r * 1.12, r * 1.08, 0.34); };
  const blobPath = (x, z, r, n, jit) => {
    const p = []; for (let i = 0; i < n; i++) { const a = i / n * TAU, rr = r * (1 - jit + jit * 2 * rand()); p.push([x + Math.cos(a) * rr, z + Math.sin(a) * rr]); }
    c.beginPath(); const m0 = [(p[0][0] + p[n - 1][0]) / 2, (p[0][1] + p[n - 1][1]) / 2]; c.moveTo(m0[0], m0[1]);
    for (let i = 0; i < n; i++) { const a = p[i], b = p[(i + 1) % n]; c.quadraticCurveTo(a[0], a[1], (a[0] + b[0]) / 2, (a[1] + b[1]) / 2); }
    c.closePath();
  };
  const shaded = (x, z, r, h, s, l, edge = 0.55) => {
    const g = c.createRadialGradient(x - r * 0.35, z - r * 0.35, r * 0.05, x, z, r * 1.1);
    g.addColorStop(0, `hsl(${h},${s}%,${Math.min(l + 20, 90)}%)`); g.addColorStop(0.55, `hsl(${h},${s}%,${l}%)`); g.addColorStop(1, `hsl(${h},${s}%,${l * edge}%)`);
    c.fillStyle = g; c.fill();
  };

  // --- seagrass meadows
  const meadows = [];
  for (let t = 0; t < 40 && meadows.length < 8; t++) {
    const p = pick(4.5, 30), r = R(1.5, 3.1);
    if (p && wet(p[0], p[1], r + 3) && meadows.every(m => Math.hypot(m.x - p[0], m.z - p[1]) > m.r + r + 1.2)) meadows.push({ x: p[0], z: p[1], r });

  if (whirl.on) { ptr.whirl = true; whirl.x = p.x; whirl.z = p.z; }
  touchWater(p.x, p.z, 1);
});
canvas.addEventListener('pointermove', e => {
  if (!ptr.down) return;
  const p = toPlane(e.clientX, e.clientY);
  if (ptr.whirl) { whirl.x = p.x; whirl.z = p.z; return; }
  const now = performance.now(); if (now - ptr.last < 70) return; ptr.last = now;
  touchWater(p.x, p.z, 0.5);
});
const endPtr = () => { ptr.down = false; ptr.whirl = false; };
canvas.addEventListener('pointerup', endPtr); canvas.addEventListener('pointercancel', endPtr);

// dock cards: tap = throw, drag = hold above the sea then drop
function throwFrom(k, sx, sy) {
  const a = toPlane(sx, sy, 2.6);
  let tx = 0, tz = 0, ok = false;
  for (let i = 0; i < 24 && !ok; i++) {
    tx = rnd(view.x0 + 3, view.x1 - 3); tz = rnd(view.z0 + 3, view.z1 - 3);
    const d = Math.hypot(tx - a.x, tz - a.z); ok = shoreS(tx, tz) > 6 && d > 4 && d < 18;
  }
  if (!ok) { tx = view.x0 + view.Wv * 0.6; tz = view.z0 + view.Hv * 0.45; }
  const T = 1.1, vy0 = 8, c = makeCreature(k, a.x, a.z);
  c.state = 'air'; c.y = 2.6; c.vx = (tx - a.x) / T; c.vz = (tz - a.z) / T; c.vy = vy0; c.g = 2 * (2.6 + vy0 * T) / (T * T);
  c.hd = Math.atan2(c.vx, c.vz); c.spin = rnd(2.5, 4.5) * (Math.random() < 0.5 ? -1 : 1);
  addCreature(c);
}
let drag = null;
const dockEl = $('dock');
const overDock = e => { const r = dockEl.getBoundingClientRect(); return e.clientY > r.top - 10 && e.clientX > r.left && e.clientX < r.right; };
function releaseHold(drop, e) {
  const c = held.c; held.c = null;
  if (drag && drag.card) drag.card.style.opacity = '';
  if (!c) return;
  if (!drop || (e && overDock(e))) { c.dying = true; c.state = 'swim'; return; }
  c.state = 'air'; c.vx = clamp(c.hvx * 0.5, -6, 6); c.vz = clamp(c.hvz * 0.5, -6, 6); c.vy = 0; c.g = 9.8; c.spin = rnd(-1.5, 1.5);
  if (c.cls === 'ray') c.hd = Math.atan2(c.vx || 0.001, c.vz || 0.001);
}
document.querySelectorAll('.card').forEach(card => {
  card.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    drag = { card, k: card.dataset.k, id: e.pointerId, sx: e.clientX, sy: e.clientY, held: false };
  });
  card.addEventListener('click', e => {
    if (e.detail !== 0) return;
    const r = card.getBoundingClientRect(); throwFrom(card.dataset.k, r.left + r.width / 2, r.top + r.height / 2);
  });
});
addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  if (!drag.held && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 8) {
    drag.held = true; drag.card.style.opacity = '0.55';
    const p = toPlane(e.clientX, e.clientY, 2.4), c = makeCreature(drag.k, p.x, p.z);
    c.state = 'held'; c.y = 2.4; held.tx = p.x; held.tz = p.z; held.c = c; addCreature(c);
  }
  if (drag.held) { const p = toPlane(e.clientX, e.clientY, 2.4); held.tx = p.x; held.tz = p.z; }
});
addEventListener('pointerup', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const d = drag;
  if (d.held) releaseHold(true, e); else throwFrom(d.k, d.sx, d.sy);
  drag = null;
});
addEventListener('pointercancel', e => { if (drag && e.pointerId === drag.id) { if (drag.held) releaseHold(false); drag = null; } });

// card thumbnails: the real models rendered once into the dock canvases
function makeThumbs() {
  const S = 168, rt = new THREE.WebGLRenderTarget(S, S, { depthBuffer: true });
  const tScene = new THREE.Scene(), tCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 60);
  tCam.up.set(0, 0, -1);
  const fit = { manta: [1.95, 0.35], eagle: [1.8, 1.1], sting: [1.45, 0.45], moon: [1.25, 0.35], nettle: [2.1, 0.9] };
  document.querySelectorAll('.card').forEach(card => {
    const k = card.dataset.k, [h, cz] = fit[k], c = makeCreature(k, 0, 0);
    c.y = 0; c.vis = 1;
    let pool;
    if (c.cls === 'ray') {
      pool = new RayPool(k, 1, false); c.hd = Math.PI; c.scale = 1; c.flap = 1.3; c.amp = 0.6; c.roll = 0; c.pitch = 0; pool.update([c]); tScene.add(pool.mesh);
    } else {
      pool = new JellyPool(k, 1, false); c.scale = k === 'moon' ? 0.75 : 0.5; c.ax = 0; c.ay = 0.72; c.az = -0.7; c.pulse = 0.3; c.psi = 0.1; pool.update([c], 0.016, 0); tScene.add(...pool.meshes);
    }
    tCam.left = -h; tCam.right = h; tCam.top = h; tCam.bottom = -h; tCam.updateProjectionMatrix();
    tCam.position.set(0, 20, cz); tCam.lookAt(0, 0, cz); tCam.updateMatrixWorld();
    renderer.setRenderTarget(rt); renderer.setClearColor(0x000000, 0); renderer.clear(); renderer.render(tScene, tCam);
    renderer.setRenderTarget(null); renderer.setClearColor(0x0a3b5c, 1);
    const buf = new Uint8Array(S * S * 4); renderer.readRenderTargetPixels(rt, 0, 0, S, S, buf);
    const img = new ImageData(S, S);
    for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
      const s = ((S - 1 - y) * S + x) * 4, d = (y * S + x) * 4, a = buf[s + 3];
      if (a > 0) { const f = 255 / a; img.data[d] = Math.min(255, buf[s] * f); img.data[d + 1] = Math.min(255, buf[s + 1] * f); img.data[d + 2] = Math.min(255, buf[s + 2] * f); }
      img.data[d + 3] = a;
    }
    const tmp = document.createElement('canvas'); tmp.width = tmp.height = S; tmp.getContext('2d').putImageData(img, 0, 0);
    const cv = card.querySelector('canvas'), ctx = cv.getContext('2d');
    const g = ctx.createRadialGradient(S * 0.4, S * 0.35, 8, S / 2, S / 2, S * 0.75);
    g.addColorStop(0, '#2fb7b5'); g.addColorStop(0.55, '#0f7a9a'); g.addColorStop(1, '#0a3b6a');
    ctx.fillStyle = g; ctx.fillRect(0, 0, S, S); ctx.drawImage(tmp, 0, 0);
    tScene.clear(); pool.geo.dispose(); if (pool.rgeo) pool.rgeo.dispose();
  });
  rt.dispose();
}

// init
applyRes();
bakeSeabed();
for (const [k, n] of [['manta', 2], ['eagle', 1], ['sting', 1], ['moon', 3], ['nettle', 2]]) for (let i = 0; i < n; i++) {
  const p = pickPoint(k), c = makeCreature(k, p[0], p[1]);
  c.y = k === 'sting' ? -bedDepth(p[0], p[1]) + 0.05 : -rnd(0.8, 1.2);
  if (k === 'sting') { c.state = 'rest'; c.rest = rnd(3, 10); }
  creatures.push(c);
}
makeThumbs();
updateCount();
addEventListener('resize', applyRes);

let last = performance.now(), simAcc = 0, tNow = 0, emaDt = 0.016, qTimer = 0, calmV = 0, rainV = 0, rainAcc = 0;
function frame(ms) {
  requestAnimationFrame(frame);
  const raw = Math.min((ms - last) / 1000, 0.2); last = ms; if (raw <= 0) return;
  const dt = Math.min(raw, 0.05) * (reduced ? 0.35 : 1);
  tNow += dt; U.uTime.value = tNow;
  calmV += ((flags.calm ? 1 : 0) - calmV) * Math.min(1, raw * 1.5); U.uCalm.value = calmV;
  rainV += ((flags.rain ? 1 : 0) - rainV) * Math.min(1, raw * 1.2); U.uRain.value = rainV;
  whirl.s += ((whirl.on ? 1 : 0) - whirl.s) * Math.min(1, raw * 1.5);
  U.uWhirl.value.set(whirl.x, whirl.z, whirl.s);
  if (whirl.s > 0.1) addDrop(whirl.x + Math.cos(tNow * 3) * 1.1, whirl.z + Math.sin(tNow * 3) * 1.1, 0.7, 0.03 * Math.sin(tNow * 5));
  if (rainV > 0.02) {
    rainAcc += dt * 60 * rainV;
    while (rainAcc >= 1) { rainAcc--; const x = rnd(view.x0, view.x1), z = rnd(view.z0, view.z1); addDrop(x, z, 0.32, 0.06); if (Math.random() < 0.15) ring(x, z, 0.45, 0.8); if (Math.random() < 0.02) plink(0.03); }
  }
  updateCreatures(dt, tNow);
  updateParticles(dt);
  audioUpdate(tNow, calmV, rainV);
  simAcc += dt; let steps = 0;
  while (simAcc >= 1 / 30 && steps < 2) { simStep(); simAcc -= 1 / 30; steps++; }
  if (simAcc > 0.1) simAcc = 0;
  waterMat.uniforms.uSim.value = simA.texture;
  renderer.setRenderTarget(shRT); renderer.setClearColor(0x000000, 0); renderer.clear(); renderer.render(shScene, shCam);
  renderer.setRenderTarget(null); renderer.setClearColor(0x0a3b5c, 1);
  renderer.render(scene, camera);
  // adaptive render quality
  emaDt += (raw - emaDt) * 0.05; qTimer += raw;
  if (qTimer > 1.5) {
    qTimer = 0;
    if (emaDt > 0.027 && quality > 0.5) { quality = Math.max(0.5, quality - 0.15); applyRes(); }
    else if (emaDt < 0.0185 && quality < 1) { quality = Math.min(1, quality + 0.05); applyRes(); }
  }
}
requestAnimationFrame(frame);
