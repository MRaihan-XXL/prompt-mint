<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gothic Mage Circle - DepthGlow preview</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:#0a0a0f;color:#f5f5f7;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}

.bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 60%,#1e1b4b 0%,#0b0914 65%)}
.ring{position:absolute;left:50%;top:50%;translate:-50% -50%;animation:spinCW 40s linear infinite}
.ring.r2{animation:spinCCW 55s linear infinite}
.ring.r3{animation:spinCW 70s linear infinite}
@keyframes spinCW{to{rotate:360deg}}
@keyframes spinCCW{to{rotate:-360deg}}
.rune-float{position:absolute;color:#a78bfa;font-size:18px;opacity:.7;animation:up 11s linear infinite}
@keyframes up{to{translate:0 -30vh;opacity:0;rotate:40deg}}
.candle{position:absolute;width:10px;height:14px;border-radius:50% 50% 40% 40%;background:radial-gradient(#fde68a,#f59e0b 60%,transparent);animation:cf 2.6s ease-in-out infinite}
@keyframes cf{50%{scale:1.15 .9;opacity:.85}}
.cfloor{position:absolute;width:70px;height:18px;border-radius:50%;background:radial-gradient(rgba(251,191,36,.35),transparent 70%)}
canvas{position:absolute;inset:0}

.content{position:relative;z-index:5;text-align:center;padding:0 24px;max-width:760px}
h1{font-size:clamp(2.2rem,6vw,4.2rem);line-height:1.05;letter-spacing:-.03em;font-weight:800}
p.sub{color:#a1a1b3;font-size:clamp(.95rem,2vw,1.15rem);margin-top:16px;line-height:1.6}
.tag{display:inline-block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;border:1px solid rgba(255,255,255,.22);padding:6px 14px;border-radius:999px;margin-bottom:22px;color:#cfcfe0}
</style>
</head>
<body>

<div class="bg"></div>
<canvas id="stars"></canvas>
<svg class="ring r3" width="560" height="560" viewBox="0 0 560 560"><circle cx="280" cy="280" r="258" stroke="#8b5cf6" stroke-width="1.5" fill="none" stroke-dasharray="18 10" opacity=".5"/></svg>
<svg class="ring r2" width="440" height="440" viewBox="0 0 440 440"><circle cx="220" cy="220" r="208" stroke="#a78bfa" stroke-width="2" fill="none"/><polygon points="220,40 360,300 80,300" stroke="#c4b5fd" stroke-width="1.5" fill="none" opacity=".7"/><polygon points="220,400 80,140 360,140" stroke="#c4b5fd" stroke-width="1.5" fill="none" opacity=".7"/></svg>
<svg class="ring" width="320" height="320" viewBox="0 0 320 320"><circle cx="160" cy="160" r="150" stroke="#c4b5fd" stroke-width="2.5" fill="none"/><circle cx="160" cy="160" r="120" stroke="#8b5cf6" stroke-width="1" fill="none" stroke-dasharray="6 6"/></svg>
<svg style="position:absolute;left:50%;top:56%;translate:-50% -50%;z-index:4" width="220" height="340" viewBox="0 0 220 340">
<path d="M110 30 L86 66 L90 96 Q60 110 56 160 L40 336 L180 336 L164 160 Q160 110 130 96 L134 66 Z" fill="#0b0914" stroke="#312e81" stroke-width="3"/>
<path d="M56 160 L18 120 M164 160 L202 120" stroke="#0b0914" stroke-width="16" stroke-linecap="round"/>
</svg>
<div id="frunes"></div>
<div id="candles"></div>

<div class="content">
<span class="tag">DepthGlow preview</span>
<h1>Gothic Mage Circle</h1>
<p class="sub">Live demo — the paid prompt rebuilds this scene and more in your AI.</p>
</div>
<script>
(function(){
  // starfield
  var cv=document.getElementById('stars'),cx=cv.getContext('2d');
  function size(){cv.width=innerWidth;cv.height=innerHeight}
  size();addEventListener('resize',size);
  var S=[];for(var i=0;i<90;i++)S.push({x:Math.random(),y:Math.random(),p:Math.random()*7});
  (function loop(t){
    cx.clearRect(0,0,cv.width,cv.height);
    S.forEach(function(s){cx.fillStyle='rgba(224,231,255,'+(0.3+0.5*Math.abs(Math.sin(t*0.001+s.p)))+')';cx.fillRect(s.x*cv.width,s.y*cv.height,1.6,1.6)});
    requestAnimationFrame(loop);
  })(0);
  // floating runes
  var host=document.getElementById('frunes'),g=['ᚲ','ᛇ','ᛚ','ᛞ','ᛟ','ᛁ','ᛉ','ᚾ'];
  for(var r=0;r<14;r++){var d=document.createElement('div');d.className='rune-float';d.textContent=g[r%g.length];
    d.style.left=(10+Math.random()*80)+'%';d.style.top=(30+Math.random()*50)+'%";
    d.style.animationDuration=(9+Math.random()*5)+'s';d.style.animationDelay=(-Math.random()*11)+'s';host.appendChild(d);}
  // candles
  var ch=document.getElementById('candles');
  for(var c=0;c<5;c++){var f=document.createElement('div');f.className='candle';
    f.style.left=(14+c*18)+'%';f.style.bottom='8vh';f.style.animationDuration=(2.2+Math.random()*.9)+'s';
    var fl=document.createElement('div');fl.className='cfloor';fl.style.left=((14+c*18)-1.2)+'%';fl.style.bottom='7vh';
    ch.appendChild(f);ch.appendChild(fl);}
})();
</script>
</body>
</html>
