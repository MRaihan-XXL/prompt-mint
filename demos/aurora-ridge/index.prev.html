<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<style>
html,body{margin:0;height:100%;background:#02030a;overflow:hidden;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.v{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,transparent 52%,rgba(1,2,8,.6) 100%)}
</style>
<script type="importmap">{"imports":{"three":"../../js/vendor/three.module.min.js","three/addons/":"../../js/vendor/jsm/"}}</script>
</head>
<body>
<div class="v" aria-hidden="true"></div>
<script type="module">
import * as THREE from 'three';

/* ---------- environment ---------- */
const RMQ = matchMedia('(prefers-reduced-motion: reduce)');
let RM = RMQ.matches;
RMQ.addEventListener('change', e => { RM = e.matches; });
const NARROW = innerWidth < 700;
const OCT = NARROW ? 3 : 4;

/* ---------- JS noise (terrain / mountains) ---------- */
const hash = (x, y) => { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); };
function vn(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  const a = hash(ix, iy), b = hash(ix + 1, iy), c = hash(ix, iy + 1), d = hash(ix + 1, iy + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, o = 4) {
  let s = 0, a = .5;
  for (let i = 0; i < o; i++) { s += a * vn(x, y); x = x * 2.03 + 17.1; y = y * 2.03 + 9.2; a *= .5; }
  return s;
}
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

/* ---------- GLSL noise chunk (OCT define set per material) ---------- */
const NOISE = /* glsl */`
float hash21(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
float hash31(vec3 p){ p=fract(p*vec3(.1031,.1030,.0973)); p+=dot(p,p.yxz+33.33); return fract((p.x+p.y)*p.z); }
float vnoise(vec2 p){
  vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  float a=hash21(i), b=hash21(i+vec2(1.,0.)), c=hash21(i+vec2(0.,1.)), d=hash21(i+vec2(1.,1.));
  return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);
}
float vnoise3(vec3 p){
  vec3 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  float a=hash31(i), b=hash31(i+vec3(1,0,0)), c=hash31(i+vec3(0,1,0)), d=hash31(i+vec3(1,1,0));
  float e=hash31(i+vec3(0,0,1)), g=hash31(i+vec3(1,0,1)), h=hash31(i+vec3(0,1,1)), k=hash31(i+vec3(1,1,1));
  return mix(mix(mix(a,b,f.x),mix(c,d,f.x),f.y), mix(mix(e,g,f.x),mix(h,k,f.x),f.y), f.z);
}
float fbm(vec2 p){ float s=0., a=.5; for(int i=0;i<OCT;i++){ s+=a*vnoise(p); p=p*2.03+vec2(17.1,9.2); a*=.5; } return s; }
float fbm3(vec3 p){ float s=0., a=.5; for(int i=0;i<4;i++){ s+=a*vnoise3(p); p=p*2.03+vec3(7.1,3.7,11.3); a*=.5; } return s; }
`;
const GREEN = 'vec3(.12,1.,.42)', VIOLET = 'vec3(.74,.24,.92)';

/* ---------- shared uniforms ---------- */
const U = {
  uTime: { value: 0 },
  uAur: { value: .6 },
  uScale: { value: 600 },
  uPool: { value: new THREE.Vector3() }
};

/* ---------- sky: gradient, stars, milky way, cirrus haze ---------- */
const skyMat = new THREE.ShaderMaterial({
  defines: { OCT },
  uniforms: { uTime: U.uTime, uAur: U.uAur },
  side: THREE.BackSide, depthWrite: false,
  vertexShader: `varying vec3 vDir; void main(){ vDir=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: NOISE + `
varying vec3 vDir; uniform float uTime, uAur;
vec3 stars(vec3 d){
  vec3 acc=vec3(0.);
  for(int L=0;L<3;L++){
    float s = L==0 ? 70. : (L==1 ? 150. : 320.);
    float P = L==0 ? .5 : (L==1 ? .25 : .07);
    float rb = L==0 ? .13 : (L==1 ? .10 : .09);
    vec3 p=d*s; vec3 c=floor(p); vec3 f=p-c;
    float h=hash31(c+float(L)*7.3);
    if(h>P) continue;
    float m=h/P;
    vec3 o=vec3(hash31(c+3.1),hash31(c+7.7),hash31(c+11.3));
    float dist=length(f-o);
    float r=max(rb*(1.+1.6*pow(hash31(c+5.5),6.)), length(fwidth(p))*.8);
    float b=mix(.3,1.,pow(hash31(c+9.9),2.))*(L==0?1.5:1.);
    float tw=.82+.18*sin(uTime*(1.4+m*3.)+m*60.);
    vec3 tint=mix(vec3(.7,.82,1.),vec3(1.,.9,.74),hash31(c+13.7));
    acc+=tint*smoothstep(r,r*.25,dist)*b*tw;
  }
  return acc;
}
void main(){
  vec3 d=normalize(vDir);
  float e=clamp(d.y,-.2,1.);
  vec3 col=mix(vec3(.05,.065,.17),vec3(.004,.006,.02),pow(clamp(e*1.4,0.,1.),.6));
  float az=atan(d.x,-d.z);
  col+=uAur*exp(-pow((e-.12)*3.5,2.))*vec3(.02,.09,.06)*(.6+.8*vnoise(vec2(az*3.,uTime*.02)));
  /* milky way */
  vec3 n=normalize(vec3(.35,.8,.45));
  float b=dot(d,n);
  float band=exp(-b*b*28.);
  float mw=band*(.35+.9*fbm3(d*6.))*(1.-.6*smoothstep(.45,.7,fbm3(d*11.+4.)));
  col+=(vec3(.14,.15,.24)+vec3(.12,.08,.06)*fbm3(d*3.))*mw*.55;
  /* thin cirrus haze catching aurora colour */
  vec2 cu=d.xz/(d.y+.3)*1.2;
  float cl=smoothstep(.55,.85,fbm(vec2(cu.x*.8+uTime*.003,cu.y*2.5)))*.35*smoothstep(.05,.3,d.y);
  col+=(vec3(.04,.07,.12)+vec3(.2,.9,.5)*uAur*.35)*cl*.5;
  col+=stars(d)*smoothstep(0.,.12,d.y)*(1.-cl*1.2);
  gl_FragColor=vec4(col,1.);
}`
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(600, 48, 24), skyMat);
sky.renderOrder = -10; sky.frustumCulled = false;

/* ---------- aurora curtains ---------- */
const CURTAINS = [
  { x: -26, z: -58,  base: 13, h: 46, w: 150, seed: .13, red: 0,   rot: .18,  fold: 14, gain: .95, rate: 1.0 },
  { x: 20,  z: -76,  base: 12, h: 52, w: 170, seed: .47, red: .8,  rot: -.22, fold: 18, gain: 1.0, rate: .8 },
  { x: -6,  z: -98,  base: 11, h: 58, w: 200, seed: .81, red: 1.0, rot: .1,   fold: 22, gain: .9,  rate: 1.15 },
  { x: 34,  z: -122, base: 9,  h: 60, w: 230, seed: .29, red: .5,  rot: -.15, fold: 24, gain: .8,  rate: .9 }
];
const curtainVert = NOISE + `
uniform float uTime, uSeed, uWidth, uHeight, uBase, uFoldAmp;
varying vec2 vUv; varying vec3 vW;
void main(){
  vUv=uv;
  float x=(uv.x-.5)*uWidth;
  float w=fbm(vec2(x*.011+uSeed*7., uTime*.02+uSeed));
  float z=sin(x*.028+uSeed*5.+uTime*.045+w*5.)*uFoldAmp + sin(x*.011+uSeed*2.+uTime*.02)*uFoldAmp*1.6 + (w-.5)*uFoldAmp*1.5;
  vec3 p=vec3(x+sin(uv.y*2.5+uSeed*9.+uTime*.1)*2., uBase+uv.y*uHeight, z+sin(uv.y*3.+uTime*.08+uSeed)*3.*uv.y);
  vec4 wp=modelMatrix*vec4(p,1.);
  vW=wp.xyz;
  gl_Position=projectionMatrix*viewMatrix*wp;
}`;
const curtainFrag = NOISE + `
uniform float uTime, uSeed, uWidth, uRed, uGain;
varying vec2 vUv; varying vec3 vW;
void main(){
  float x=(vUv.x-.5)*uWidth, h=vUv.y, t=uTime;
  /* domain-warped ribbon field */
  vec2 p=vec2(x*.035+uSeed*11., t*.06);
  vec2 q=vec2(fbm(p+vec2(0.,t*.05)), fbm(p+vec2(5.2,1.3)-t*.04));
  float r=fbm(p+3.*q);
  float pres=smoothstep(.28,.7,fbm(vec2(x*.018+uSeed*3., t*.02+uSeed))+(q.x-.5)*.35);
  pres*=smoothstep(0.,.14,vUv.x)*smoothstep(1.,.86,vUv.x);
  float rays=vnoise(vec2(x*.32+q.x*9.+uSeed*20., h*1.2-t*.12));
  rays=.35+.9*smoothstep(.2,.9,rays);
  float edge=.10+.13*r+.05*rays;
  float hh=h-edge;
  float body=smoothstep(0.,.05,hh)*exp(-max(hh,0.)*2.6)*(1.-smoothstep(.55,1.,h));
  float fringe=smoothstep(-.07,0.,hh)*exp(-max(hh,0.)*20.);
  float red=smoothstep(.55,.92,h)*uRed*smoothstep(0.,.05,hh)*(1.-smoothstep(.92,1.,h));
  vec3 col=${GREEN}*body*(.9+.4*r);
  col=mix(col,vec3(.55,1.,.65),clamp(body*rays-.55,0.,.5));
  col+=${VIOLET}*fringe*.9+vec3(1.,.1,.22)*red*.9;
  float shimmer=.8+.4*vnoise(vec2(x*.12+t*.3, h*18.-t*1.4));
  /* brighten where a fold is seen edge-on */
  vec3 nrm=normalize(cross(dFdx(vW),dFdy(vW)));
  float ndv=abs(dot(nrm,normalize(cameraPosition-vW)));
  float fold=.55+1.6*pow(1.-ndv,2.);
  float I=pres*rays*shimmer*uGain*fold;
  gl_FragColor=vec4(col*I,1.);
}`;

/* ---------- terrain ---------- */
const POND = { x: -6, z: -16, rx: 11, rz: 5.5, h: .25 };
function ground(x, z) {
  const near = smooth(16, -6, z);
  let h = .15 + (fbm(x * .045 + 3, z * .07) - .45) * 5.5 * near;
  h += (fbm(x * .03 + 20, z * .16 + 5) - .5) * 2.4 * near;
  h += Math.exp(-(((z + 38 + .12 * x + 4 * Math.sin(x * .06)) / 9) ** 2)) * 4.2 * (.7 + .5 * fbm(x * .05, 1));
  h += Math.exp(-((x + 28) ** 2 / 120 + (z + 4) ** 2 / 150)) * 2.2 + Math.exp(-((x - 30) ** 2 / 140 + (z + 2) ** 2 / 150)) * 2;
  h -= smooth(-58, -88, z) * 2.2;
  const d = ((x - POND.x) / POND.rx) ** 2 + ((z - POND.z) / POND.rz) ** 2;
  const k = 1 - smooth(.9, 1.8, d);
  return h + (POND.h - .05 - h) * k;
}
const terrainMat = new THREE.ShaderMaterial({
  defines: { OCT: 3 },
  uniforms: { uTime: U.uTime, uAur: U.uAur, uPool: U.uPool },
  vertexShader: `varying vec3 vW; varying vec3 vN; void main(){ vW=position; vN=normal; gl_Position=projectionMatrix*viewMatrix*vec4(position,1.); }`,
  fragmentShader: NOISE + `
varying vec3 vW; varying vec3 vN; uniform float uTime, uAur; uniform vec3 uPool;
float sast(vec2 p, float warp){
  vec2 q=vec2(p.x*.55+warp*5., p.y*1.5);
  return (1.-abs(2.*vnoise(q)-1.))*.7+vnoise(q*vec2(2.1,2.3)+7.)*.3;
}
void main(){
  vec3 V=normalize(cameraPosition-vW);
  float dist=length(cameraPosition-vW);
  /* sastrugi: wind-carved ridges perturb the normal */
  float warp=fbm(vW.xz*.12);
  float s0=sast(vW.xz,warp), e=.08;
  float gx=(sast(vW.xz+vec2(e,0.),warp)-s0)/e, gz=(sast(vW.xz+vec2(0.,e),warp)-s0)/e;
  float nf=smoothstep(90.,20.,dist);
  vec3 N=normalize(vN+vec3(-gx,0.,-gz)*.15*nf);
  vec3 moon=normalize(vec3(.25,.5,.82));
  float nl=max(dot(N,moon),0.);
  float t=uTime;
  float mixc=smoothstep(-.5,.5,sin(vW.x*.035+t*.05)+.4*sin(vW.z*.05-t*.03));
  vec3 aCol=mix(vec3(.15,1.,.5),vec3(.6,.3,1.),mixc*.6);
  float aVar=.55+.65*fbm(vec2(vW.x*.03+t*.04,vW.z*.02));
  float up=N.y*.5+.5;
  vec3 bounce=aCol*uAur*aVar*(.25+.75*up)*.7;
  float wrap=pow(dot(N,moon)*.5+.5,2.);
  vec3 snow=vec3(.80,.84,.94);
  vec3 c=snow*(vec3(.05,.07,.15)+vec3(.32,.38,.52)*nl*.85+vec3(.06,.09,.17)*wrap+bounce*.5);
  /* warm pool from the cabin window */
  float pd=distance(vW.xz,uPool.xz);
  float fl=.92+.08*sin(t*7.3)*sin(t*3.1);
  c+=vec3(1.,.55,.18)*exp(-pd*pd/11.)*(.25+.75*up)*.75*fl*smoothstep(.0,.6,1.-abs(vW.y-uPool.y)*.25);
  /* view-dependent glints */
  vec3 cell=floor(vec3(vW.xz*9.,0.)).xzy;
  float hs=hash31(cell);
  if(hs>.975){
    vec3 rn=normalize(N+(vec3(hash31(cell+1.7),hash31(cell+4.1),hash31(cell+8.3))-.5)*1.5);
    float g=pow(max(dot(rn,normalize(V+moon)),0.),90.);
    c+=vec3(.8,.92,1.)*g*1.6*smoothstep(75.,20.,dist);
  }
  float fg=smoothstep(55.,120.,dist);
  c=mix(c,vec3(.03,.045,.1)+aCol*uAur*.02,fg);
  gl_FragColor=vec4(c,1.);
}`
});

/* ---------- frozen pond ---------- */
const pondMat = new THREE.ShaderMaterial({
  defines: { OCT: 3 },
  uniforms: { uTime: U.uTime, uAur: U.uAur },
  transparent: true, depthWrite: false,
  vertexShader: `varying vec3 vW; varying vec2 vUv; void main(){ vUv=uv; vec4 wp=modelMatrix*vec4(position,1.); vW=wp.xyz; gl_Position=projectionMatrix*viewMatrix*wp; }`,
  fragmentShader: NOISE + `
varying vec3 vW; varying vec2 vUv; uniform float uTime, uAur;
void main(){
  vec3 V=normalize(cameraPosition-vW);
  vec2 q=vW.xz;
  vec3 N=normalize(vec3((vnoise(q*3.)-.5)*.03,1.,(vnoise(q*3.+9.)-.5)*.03));
  vec3 R=reflect(-V,N);
  float e=R.y, az=atan(R.x,-R.z);
  float sm=fbm(vec2(az*2.2+uTime*.03,e*1.2));
  float band=smoothstep(.04,.3,e)*(1.-smoothstep(.75,1.,e));
  vec3 aur=mix(vec3(.15,1.,.5),vec3(.7,.3,1.),smoothstep(.2,.8,sm)*.5)*band*(.35+1.1*sm)*uAur*1.1;
  float fres=pow(1.-max(dot(V,N),0.),3.);
  vec3 col=vec3(.015,.03,.06)+aur*(.35+.9*fres);
  vec3 moon=normalize(vec3(.25,.5,.82));
  col+=vec3(.7,.85,1.)*pow(max(dot(R,moon),0.),600.)*.6;
  float cr=smoothstep(.035,0.,abs(fbm(q*.35)-.5))*.18;
  col+=vec3(.5,.65,.9)*cr*.45;
  float r=length(vUv-.5)*2.;
  gl_FragColor=vec4(col,smoothstep(1.,.9,r)*.96);
}`
});

/* ---------- mountain silhouettes ---------- */
function mountain(z, top, w, col, seed) {
  const N = 240, pos = new Float32Array((N + 1) * 6), idx = [];
  for (let i = 0; i <= N; i++) {
    const x = (i / N - .5) * w;
    const r = 1 - Math.abs(fbm(x * .011 + seed, seed, 5) * 2 - 1);
    const y = top * (.25 + .75 * Math.pow(r, 1.3)) * (.8 + .2 * fbm(x * .04, seed));
    pos.set([x, y, z, x, -40, z], i * 6);
  }
  for (let i = 0; i < N; i++) { const a = 2 * i, b = a + 1, c = a + 2, d = a + 3; idx.push(a, b, c, b, d, c); }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setIndex(idx);
  const m = new THREE.ShaderMaterial({
    side: THREE.DoubleSide,
    uniforms: { uCol: { value: new THREE.Color(col[0], col[1], col[2]) }, uTop: { value: top }, uAur: U.uAur },
    vertexShader: `varying float vY; void main(){ vY=position.y; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
    fragmentShader: `varying float vY; uniform vec3 uCol; uniform float uTop, uAur;
void main(){ float k=clamp((vY+5.)/uTop,0.,1.); vec3 c=mix(uCol*.7,uCol*1.35+vec3(.01,.02,.04),k); c+=vec3(.03,.1,.07)*uAur*.18*k; gl_FragColor=vec4(c,1.); }`
  });
  const mesh = new THREE.Mesh(g, m);
  mesh.frustumCulled = false;
  return mesh;
}

/* ---------- meteor ---------- */
const meteorMat = new THREE.ShaderMaterial({
  transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
  uniforms: { uHead: { value: new THREE.Vector3() }, uDir: { value: new THREE.Vector3(1, 0, 0) }, uLen: { value: 70 }, uW: { value: 1.6 }, uA: { value: 0 } },
  vertexShader: `uniform vec3 uHead, uDir; uniform float uLen, uW; varying vec2 vUv;
void main(){
  vUv=uv;
  vec3 p=uHead-uDir*uLen*(1.-uv.x);
  vec3 side=normalize(cross(uDir,normalize(cameraPosition-p)));
  p+=side*(uv.y-.5)*uW*(.3+.7*uv.x);
  gl_Position=projectionMatrix*viewMatrix*vec4(p,1.);
}`,
  fragmentShader: `varying vec2 vUv; uniform float uA;
void main(){
  float trail=pow(vUv.x,3.);
  float across=pow(max(1.-abs(vUv.y-.5)*2.,0.),1.5);
  float head=smoothstep(.93,1.,vUv.x);
  vec3 c=mix(vec3(.6,.8,1.),vec3(1.),head);
  gl_FragColor=vec4(c*(trail*.9+head)*across*uA,1.);
}`
});

/* ---------- chimney plume ---------- */
const SMOKE_N = NARROW ? 24 : 36;
const smokeMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false,
  uniforms: { uTime: U.uTime, uAur: U.uAur, uScale: U.uScale, uOrigin: { value: new THREE.Vector3() } },
  vertexShader: `attribute float aSeed; uniform float uTime, uScale; uniform vec3 uOrigin; varying float vAge;
void main(){
  float age=fract(uTime*.12+aSeed);
  vAge=age;
  vec3 p=uOrigin+vec3(age*age*7.+sin(age*6.+aSeed*20.)*.25*age, age*6.5, cos(age*5.+aSeed*13.)*.2*age-age*age*1.5);
  vec4 mv=viewMatrix*vec4(p,1.);
  gl_PointSize=(.3+age*1.5)*uScale/-mv.z;
  gl_Position=projectionMatrix*mv;
}`,
  fragmentShader: `varying float vAge; uniform float uAur;
void main(){
  float d=length(gl_PointCoord-.5)*2.;
  float a=smoothstep(1.,.2,d)*(1.-vAge)*smoothstep(0.,.1,vAge)*.32;
  vec3 c=mix(vec3(1.,.6,.3),vec3(.5,.58,.72),smoothstep(0.,.2,vAge))+vec3(.1,.5,.3)*uAur*.25;
  gl_FragColor=vec4(c,a);
}`
});

/* ---------- renderer / scene / camera ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: !NARROW, powerPreference: 'high-performance', preserveDrawingBuffer: true });
renderer.setClearColor(0x02030a);
renderer.domElement.setAttribute('aria-hidden', 'true');
document.body.insertBefore(renderer.domElement, document.body.firstChild);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(58, 1, .1, 2000);
scene.add(sky);

/* lights for the standard-material props (rocks, cabin) */
const hemi = new THREE.HemisphereLight(0x3a5a8a, 0x1a1c2a, .6);
const moonLight = new THREE.DirectionalLight(0x8fb0ff, .9);
moonLight.position.set(3, 5, 8);
scene.add(hemi, moonLight);

/* mountains: three low-contrast layers */
scene.add(
  mountain(-240, 22, 700, [.07, .09, .17], 1.3),
  mountain(-190, 15, 600, [.05, .065, .13], 4.7),
  mountain(-140, 10, 520, [.035, .045, .095], 8.9)
);

/* aurora curtains */
const defs = { OCT };
const curtains = CURTAINS.slice(0, NARROW ? 3 : 4).map((c, i) => {
  const mat = new THREE.ShaderMaterial({
    defines: defs, side: THREE.DoubleSide, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: {
      uTime: { value: 0 }, uSeed: { value: c.seed }, uWidth: { value: c.w }, uHeight: { value: c.h },
      uBase: { value: c.base }, uFoldAmp: { value: c.fold }, uRed: { value: c.red }, uGain: { value: c.gain }
    },
    vertexShader: curtainVert, fragmentShader: curtainFrag
  });
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1, NARROW ? 64 : 128, 12), mat);
  mesh.position.set(c.x, 0, c.z);
  mesh.rotation.y = c.rot;
  mesh.frustumCulled = false;
  scene.add(mesh);
  return { c, mesh, mat, phase: i * 40, stir: 0, energy: 1 };
});

/* terrain */
{
  const g = new THREE.PlaneGeometry(220, 130, NARROW ? 140 : 200, NARROW ? 80 : 120);
  g.rotateX(-Math.PI / 2);
  g.translate(0, 0, -25);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) p.setY(i, ground(p.getX(i), p.getZ(i)));
  g.computeVertexNormals();
  scene.add(new THREE.Mesh(g, terrainMat));
}

/* pond */
{
  const g = new THREE.CircleGeometry(1, 64);
  g.rotateX(-Math.PI / 2);
  const m = new THREE.Mesh(g, pondMat);
  m.position.set(POND.x, POND.h + .03, POND.z);
  m.scale.set(POND.rx, 1, POND.rz);
  m.renderOrder = 1;
  scene.add(m);
}

/* rocks breaking through the crust */
{
  const rockMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: .9, flatShading: true });
  const spots = [[-18, -26, 1.8], [4, -34, 2.4], [-26, -40, 2.8], [22, -44, 3], [16, -20, 1.2], [-12, -8, .8], [10, -5, .7], [-34, -22, 1.6]];
  const snowC = new THREE.Color(.62, .72, .9), rockC = new THREE.Color(.07, .075, .09);
  spots.forEach(([x, z, s], k) => {
    const g = new THREE.IcosahedronGeometry(1, 2);
    const p = g.attributes.position, col = new Float32Array(p.count * 3);
    for (let i = 0; i < p.count; i++) {
      const vx = p.getX(i), vy = p.getY(i), vz = p.getZ(i);
      const n = .75 + .5 * vn(vx * 2.2 + k * 5, vz * 2.2 + vy * 2) ;
      p.setXYZ(i, vx * n, vy * n * .7, vz * n);
    }
    g.computeVertexNormals();
    const nrm = g.attributes.normal;
    for (let i = 0; i < p.count; i++) {
      const c = rockC.clone().lerp(snowC, smooth(.55, .9, nrm.getY(i)) * .8);
      col.set([c.r, c.g, c.b], i * 3);
    }
    g.setAttribute('color', new THREE.BufferAttribute(col, 3));
    const m = new THREE.Mesh(g, rockMat);
    m.scale.set(s * 1.2, s, s);
    m.rotation.y = k * 1.7;
    m.position.set(x, ground(x, z) + s * .1, z);
    scene.add(m);
  });
}

/* cabin */
const cabin = new THREE.Group();
let glow, warm;
{
  const cx = 11, cz = -30;
  let gy = Infinity;
  for (const [dx, dz] of [[-1.5, -1.5], [1.5, -1.5], [-1.5, 1.5], [1.5, 1.5]]) gy = Math.min(gy, ground(cx + dx, cz + dz));
  cabin.position.set(cx, gy - .15, cz);
  cabin.rotation.y = -.3;
  const wood = new THREE.MeshStandardMaterial({ color: 0x3a2418, roughness: .9 });
  const roofM = new THREE.MeshStandardMaterial({ color: 0x2b1c16, roughness: .9 });
  const snowM = new THREE.MeshStandardMaterial({ color: 0xcfe0ff, roughness: .8 });
  const body = new THREE.Mesh(new THREE.BoxGeometry(2.4, 1.85, 2.8), wood);
  body.position.y = .85;
  const shape = new THREE.Shape([new THREE.Vector2(-1.5, 0), new THREE.Vector2(1.5, 0), new THREE.Vector2(0, 1)]);
  const roofG = new THREE.ExtrudeGeometry(shape, { depth: 3.1, bevelEnabled: false });
  roofG.translate(0, 0, -1.55);
  const roof = new THREE.Mesh(roofG, roofM);
  roof.position.y = 1.7;
  const th = Math.atan2(1, 1.5);
  const capR = new THREE.Mesh(new THREE.BoxGeometry(1.9, .14, 3.2), snowM);
  capR.position.set(.79, 2.26, 0); capR.rotation.z = -th;
  const capL = capR.clone();
  capL.position.x = -.79; capL.rotation.z = th;
  const chim = new THREE.Mesh(new THREE.BoxGeometry(.35, .9, .35), new THREE.MeshStandardMaterial({ color: 0x1d1a1c, roughness: 1 }));
  chim.position.set(.6, 2.55, -.7);
  const win = new THREE.Mesh(new THREE.PlaneGeometry(.38, .32), new THREE.MeshBasicMaterial({ color: new THREE.Color(1, .7, .3) }));
  win.position.set(0, 1.05, 1.41);
  const frame = new THREE.Mesh(new THREE.PlaneGeometry(.5, .44), new THREE.MeshBasicMaterial({ color: 0x120c0a }));
  frame.position.set(0, 1.05, 1.405);
  const door = new THREE.Mesh(new THREE.PlaneGeometry(.55, 1.05), new THREE.MeshStandardMaterial({ color: 0x1a110d, roughness: 1 }));
  door.position.set(-.7, .55, 1.41);
  cabin.add(body, roof, capR, capL, chim, frame, win, door);

  const cv = document.createElement('canvas');
  cv.width = cv.height = 64;
  const cg = cv.getContext('2d');
  const gr = cg.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,170,70,.9)');
  gr.addColorStop(.35, 'rgba(255,140,50,.28)');
  gr.addColorStop(1, 'rgba(255,120,40,0)');
  cg.fillStyle = gr; cg.fillRect(0, 0, 64, 64);
  glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(cv), blending: THREE.AdditiveBlending, depthWrite: false, transparent: true }));
  glow.scale.setScalar(3.4);
  glow.position.set(0, 1.05, 1.5);
  cabin.add(glow);
  warm = new THREE.PointLight(0xffa04a, 9, 14, 2);
  warm.position.set(0, .9, 2.2);
  cabin.add(warm);
  scene.add(cabin);
  cabin.updateMatrixWorld(true);
  const wp = win.getWorldPosition(new THREE.Vector3());
  const fwd = new THREE.Vector3(0, 0, 1).transformDirection(cabin.matrixWorld);
  U.uPool.value.copy(wp).addScaledVector(fwd, 2.2);
  U.uPool.value.y = wp.y - 1;

  /* plume */
  const sg = new THREE.BufferGeometry();
  sg.setAttribute('position', new THREE.BufferAttribute(new Float32Array(SMOKE_N * 3), 3));
  sg.setAttribute('aSeed', new THREE.BufferAttribute(Float32Array.from({ length: SMOKE_N }, (_, i) => i / SMOKE_N), 1));
  const smoke = new THREE.Points(sg, smokeMat);
  smoke.frustumCulled = false;
  smoke.renderOrder = 2;
  scene.add(smoke);
  smokeMat.uniforms.uOrigin.value.copy(chim.localToWorld(new THREE.Vector3(0, .5, 0)));
}

/* meteor */
const meteor = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), meteorMat);
meteor.frustumCulled = false;
meteor.visible = false;
scene.add(meteor);
const MET = { next: 3, t: 0, on: false, s: new THREE.Vector3(), d: new THREE.Vector3() };
function spawnMeteor() {
  const az = (Math.random() - .5) * 1.2, el = .5 + Math.random() * .45, sg = Math.random() < .5 ? -1 : 1;
  MET.s.set(Math.sin(az) * Math.cos(el), Math.sin(el), -Math.cos(az) * Math.cos(el)).multiplyScalar(350);
  MET.d.set(sg * .8, -.45, .05).normalize();
  MET.t = 0; MET.on = true; meteor.visible = true;
}

/* ---------- input ---------- */
const ptr = { x: 0, y: 0, sx: 0, sy: 0, active: false };
addEventListener('pointermove', e => {
  ptr.x = (e.clientX / innerWidth) * 2 - 1;
  ptr.y = -((e.clientY / innerHeight) * 2 - 1);
  ptr.active = true;
});
addEventListener('pointerdown', e => {
  ptr.x = (e.clientX / innerWidth) * 2 - 1;
  ptr.y = -((e.clientY / innerHeight) * 2 - 1);
  ptr.active = true;
});
document.documentElement.addEventListener('pointerleave', () => { ptr.active = false; ptr.x = 0; ptr.y = 0; });
addEventListener('pointerup', e => { if (e.pointerType === 'touch') { ptr.active = false; ptr.x = 0; ptr.y = 0; } });
addEventListener('pointercancel', () => { ptr.active = false; ptr.x = 0; ptr.y = 0; });

/* ---------- resize ---------- */
function resize() {
  const w = innerWidth, h = innerHeight;
  const dpr = Math.min(devicePixelRatio || 1, w < 700 ? 1.5 : 2);
  renderer.setPixelRatio(dpr);
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.fov = w / h < 1 ? 76 : 58;
  camera.updateProjectionMatrix();
  U.uScale.value = h * dpr / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
}
addEventListener('resize', resize);
resize();

/* ---------- loop ---------- */
const clock = new THREE.Clock();
const camTarget = new THREE.Vector3();
const tmp = new THREE.Vector3();
let T = 0;
function frame() {
  const dt = Math.min(clock.getDelta(), .05);
  T += dt;
  U.uTime.value = T;

  /* pointer smoothing + camera */
  const k = 1 - Math.exp(-dt * 3);
  ptr.sx += (ptr.x - ptr.sx) * k;
  ptr.sy += (ptr.y - ptr.sy) * k;
  const dr = RM ? 0 : 1;
  camera.position.set(Math.sin(T * .035) * 3.2 * dr, 2.6 + Math.sin(T * .05) * .08 * dr, 14 + Math.sin(T * .07) * .9 * dr);
  camTarget.set(Math.sin(T * .03 + 1) * 9 * dr, 17.5, -60);
  camera.lookAt(camTarget);
  camera.rotateY(-ptr.sx * .07);
  camera.rotateX(ptr.sy * .045);
  camera.updateMatrixWorld();
  sky.position.copy(camera.position);

  /* stir: nearest curtain to the pointer brightens and ripples */
  let best = -1, bp = 0;
  if (ptr.active && ptr.y > -.15) {
    curtains.forEach((cu, i) => {
      tmp.set(cu.mesh.position.x, cu.c.base + cu.c.h * .5, cu.mesh.position.z).project(camera);
      const p = Math.exp(-((tmp.x - ptr.x) ** 2 / .18 + (tmp.y - ptr.y) ** 2 / .8));
      if (p > bp) { bp = p; best = i; }
    });
  }
  let sum = 0;
  curtains.forEach((cu, i) => {
    cu.stir += ((i === best ? bp : 0) - cu.stir) * (1 - Math.exp(-dt * (i === best ? 2.5 : .9)));
    cu.phase += dt * cu.c.rate * (1 + cu.stir * 1.4);
    cu.energy = cu.c.gain * (.78 + .22 * Math.sin(T * .07 + i * 1.7)) * (1 + .7 * cu.stir);
    cu.mat.uniforms.uTime.value = cu.phase;
    cu.mat.uniforms.uGain.value = cu.energy;
    cu.mesh.position.x = cu.c.x + 12 * Math.sin(T * .012 + i * 2);
    sum += cu.energy;
  });
  U.uAur.value = .35 + .5 * (sum / curtains.length);
  hemi.intensity = .45 + .7 * U.uAur.value;
  hemi.color.setRGB(.12 + .08 * U.uAur.value, .3 + .5 * U.uAur.value * .6, .45 + .2 * Math.sin(T * .05));
  warm.intensity = 9 * (.94 + .06 * Math.sin(T * 7.3) * Math.sin(T * 3.1));
  glow.material.opacity = .85 + .15 * Math.sin(T * 5.1);

  /* meteors */
  if (!RM) {
    if (!MET.on) {
      MET.next -= dt;
      if (MET.next <= 0) { spawnMeteor(); MET.next = 7 + Math.random() * 9; }
    } else {
      MET.t += dt;
      const u = MET.t / 1.1;
      if (u >= 1) { MET.on = false; meteor.visible = false; }
      else {
        meteorMat.uniforms.uHead.value.copy(MET.s).addScaledVector(MET.d, 130 * MET.t);
        meteorMat.uniforms.uDir.value.copy(MET.d);
        meteorMat.uniforms.uA.value = Math.sqrt(Math.sin(Math.PI * u));
      }
    }
  } else if (MET.on) { MET.on = false; meteor.visible = false; }

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__dbg = { renderer, scene, camera };
</script>
