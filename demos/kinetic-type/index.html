<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kinetic Type — DepthGlow free preview</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0f;color:#f5f5f7;font-family:"Arial Black",system-ui,sans-serif;overflow-x:hidden}
.top{display:flex;justify-content:space-between;align-items:center;padding:22px 32px;font-family:system-ui,sans-serif}
.top .logo{font-weight:800;font-size:18px;letter-spacing:-.02em;display:flex;align-items:center;gap:9px}
.top .logo i{width:11px;height:11px;border-radius:50%;background:#ef4444;animation:blink 2.4s ease-in-out infinite;font-style:normal}
@keyframes blink{50%{opacity:.25}}
.top a.cta{background:#f5f5f7;color:#0a0a0f;padding:9px 18px;border-radius:999px;text-decoration:none;font-weight:700;font-size:13px;
  transition:transform .2s,box-shadow .2s}
.top a.cta:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 8px 24px rgba(245,245,247,.25)}
.stage{position:relative;padding:52px 32px 24px}
.line{overflow:hidden;padding-bottom:.06em}
.line h1{font-size:clamp(3rem,13vw,9rem);line-height:.92;letter-spacing:-.05em;text-transform:uppercase;
  transform:translateY(110%);animation:up .85s cubic-bezier(.16,1,.3,1) forwards;will-change:transform}
.line:nth-child(3) h1{animation-delay:.1s}
.line:nth-child(4) h1{animation-delay:.2s}
.line:nth-child(5) h1{animation-delay:.3s}
@keyframes up{to{transform:translateY(0)}}
.hi{background:linear-gradient(120deg,#f59e0b,#ef4444 60%,#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent;
  background-size:220% 100%;animation:up .85s cubic-bezier(.16,1,.3,1) .2s forwards,shift 5s ease-in-out infinite alternate}
@keyframes shift{to{background-position:100% 0}}
.outline-wrap{position:absolute;top:52px;left:0;width:100%;overflow:hidden;z-index:-1;pointer-events:none;opacity:.055}
.outline{display:flex;gap:60px;white-space:nowrap;will-change:transform}
.outline span{font-size:clamp(3rem,13vw,9rem);line-height:.92;letter-spacing:-.05em;text-transform:uppercase;
  -webkit-text-stroke:2px #f5f5f7;color:transparent}
.works{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:56px 32px 40px;font-family:system-ui,sans-serif}
.work{border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,.08);transition:transform .35s cubic-bezier(.16,1,.3,1),border-color .3s,box-shadow .3s;cursor:pointer;will-change:transform}
.work:hover{transform:translateY(-8px) scale(1.02);border-color:rgba(255,255,255,.25);box-shadow:0 24px 50px rgba(0,0,0,.5)}
.work .img{height:150px;position:relative;overflow:hidden}
.work .img::after{content:'';position:absolute;inset:0;background:linear-gradient(160deg,transparent 40%,rgba(0,0,0,.35));opacity:0;transition:opacity .3s}
.work:hover .img::after{opacity:1}
.work .img .sheen{position:absolute;top:-60%;left:-70%;width:50%;height:220%;transform:rotate(25deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent);transition:left .55s cubic-bezier(.16,1,.3,1)}
.work:hover .sheen{left:130%}
.work .meta{padding:12px 14px}
.work .meta b{font-size:14px}
.work .meta p{color:#8a8a99;font-size:12px;margin-top:2px}
.marquee{overflow:hidden;border-top:1px solid rgba(255,255,255,.07);border-bottom:1px solid rgba(255,255,255,.07);padding:14px 0;margin-bottom:20px}
.marquee-in{display:flex;gap:40px;white-space:nowrap;font-family:system-ui,sans-serif;font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;color:#71717a;will-change:transform}
@media(max-width:720px){.works{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="top"><div class="logo"><i></i>STUDIO/Ø</div><a class="cta" href="#">Let's talk</a></div>
<div class="stage">
  <div class="outline-wrap"><div class="outline" id="ol">
    <span>Loud ideas · Loud ideas · Loud ideas ·&nbsp;</span><span>Loud ideas · Loud ideas · Loud ideas ·&nbsp;</span>
  </div></div>
  <div class="line"><h1>We make</h1></div>
  <div class="line"><h1 class="hi">loud ideas</h1></div>
  <div class="line"><h1>hard to ignore.</h1></div>
</div>
<div class="marquee"><div class="marquee-in" id="mq">
  <span>Branding</span><span>·</span><span>Motion</span><span>·</span><span>Web</span><span>·</span><span>Type</span><span>·</span><span>Campaign</span><span>·</span>
  <span>Branding</span><span>·</span><span>Motion</span><span>·</span><span>Web</span><span>·</span><span>Type</span><span>·</span><span>Campaign</span><span>·</span>
</div></div>
<div class="works">
  <div class="work"><div class="img" style="background:linear-gradient(135deg,#f59e0b,#ef4444)"><div class="sheen"></div></div><div class="meta"><b>Nova Rebrand</b><p>Identity · 2026</p></div></div>
  <div class="work"><div class="img" style="background:linear-gradient(135deg,#8b5cf6,#ec4899)"><div class="sheen"></div></div><div class="meta"><b>Pulse App</b><p>Product · 2026</p></div></div>
  <div class="work"><div class="img" style="background:linear-gradient(135deg,#06b6d4,#22c55e)"><div class="sheen"></div></div><div class="meta"><b>Drift Festival</b><p>Campaign · 2025</p></div></div>
</div>
<script>
(function(){
  var ol=document.getElementById('ol'),mq=document.getElementById('mq');
  var x=0,mx=0,lastY=scrollY,boost=0;
  window.addEventListener('scroll',function(){
    boost=Math.min(Math.abs(scrollY-lastY)*.12,6);lastY=scrollY;
  },{passive:true});
  (function loop(){
    x-=1.1+boost;boost*=.92;
    if(x<-ol.scrollWidth/2)x+=ol.scrollWidth/2;
    ol.style.transform='translateX('+x+'px)';
    mx-=0.8;if(mx<-mq.scrollWidth/2)mx+=mq.scrollWidth/2;
    mq.style.transform='translateX('+mx+'px)';
    requestAnimationFrame(loop);
  })();
})();
</script>
</body>
</html>
