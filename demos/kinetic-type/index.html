<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kinetic Type — PromptMint free preview</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0f;color:#f5f5f7;font-family:"Arial Black",system-ui,sans-serif;overflow-x:hidden}
.top{display:flex;justify-content:space-between;align-items:center;padding:22px 32px;font-family:system-ui,sans-serif}
.top .logo{font-weight:800;font-size:18px;letter-spacing:-.02em}
.top a.cta{background:#f5f5f7;color:#0a0a0f;padding:9px 18px;border-radius:999px;text-decoration:none;font-weight:700;font-size:13px}
.stage{position:relative;padding:40px 32px 20px}
.line{overflow:hidden}
.line h1{font-size:clamp(3rem,13vw,9rem);line-height:.92;letter-spacing:-.05em;text-transform:uppercase;
  transform:translateY(110%);animation:up .7s cubic-bezier(.2,.8,.2,1) forwards}
.line:nth-child(2) h1{animation-delay:.09s}
.line:nth-child(3) h1{animation-delay:.18s}
.line:nth-child(4) h1{animation-delay:.27s}
@keyframes up{to{transform:translateY(0)}}
.outline{position:absolute;top:40px;left:0;width:200%;display:flex;gap:60px;z-index:-1;opacity:.06;
  animation:march 26s linear infinite;white-space:nowrap;pointer-events:none}
.outline span{font-size:clamp(3rem,13vw,9rem);line-height:.92;letter-spacing:-.05em;text-transform:uppercase;
  -webkit-text-stroke:2px #f5f5f7;color:transparent}
@keyframes march{to{transform:translateX(-50%)}}
.hi{background:linear-gradient(120deg,#f59e0b,#ef4444);-webkit-background-clip:text;background-clip:text;color:transparent}
.works{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:50px 32px 60px;font-family:system-ui,sans-serif}
.work{border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,.08);transition:transform .3s}
.work:hover{transform:scale(1.03)}
.work .img{height:150px}
.work .meta{padding:12px 14px}
.work .meta b{font-size:14px}
.work .meta p{color:#8a8a99;font-size:12px;margin-top:2px}
@media(max-width:720px){.works{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="top"><div class="logo">STUDIO/Ø</div><a class="cta" href="#">Let's talk</a></div>
<div class="stage">
  <div class="outline"><span>Loud ideas · Loud ideas · Loud ideas ·&nbsp;</span><span>Loud ideas · Loud ideas · Loud ideas ·&nbsp;</span></div>
  <div class="line"><h1>We make</h1></div>
  <div class="line"><h1 class="hi">loud ideas</h1></div>
  <div class="line"><h1>hard to ignore.</h1></div>
</div>
<div class="works">
  <div class="work"><div class="img" style="background:linear-gradient(135deg,#f59e0b,#ef4444)"></div><div class="meta"><b>Nova Rebrand</b><p>Identity · 2026</p></div></div>
  <div class="work"><div class="img" style="background:linear-gradient(135deg,#8b5cf6,#ec4899)"></div><div class="meta"><b>Pulse App</b><p>Product · 2026</p></div></div>
  <div class="work"><div class="img" style="background:linear-gradient(135deg,#06b6d4,#22c55e)"></div><div class="meta"><b>Drift Festival</b><p>Campaign · 2025</p></div></div>
</div>
</body>
</html>
